name: AURA3 Instagram Credential Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aura3-instagram-credential-diagnostic.yml'
      - 'scripts/diagnose_instagram_access.py'
      - 'operations/instagram_publish_request.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Run read-only credential diagnostic
        env:
          IG_TOKEN: ${{ secrets.IG_AURA3_TOKEN || secrets.IG_AURA2_TOKEN }}
          IG_ID: ${{ secrets.IG_AURA3_ID || secrets.IG_AURA2_ID }}
          IG_GRAPH_API_VERSION: v25.0
        run: python scripts/diagnose_instagram_access.py
      - name: Upload sanitized diagnostic
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aura3-instagram-credential-diagnostic
          path: evaluation/results/aura3-instagram-credential-diagnostic.json
          retention-days: 7
