name: AURA3 Approval Queue Maintainer

on:
  workflow_dispatch:
    inputs:
      trigger_reason:
        description: 'Why this refill cycle is running'
        required: false
        default: 'manual'

permissions:
  contents: write

concurrency:
  group: aura3-approval-queue-maintainer-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || secrets.DEEPSEEK_KEY || secrets.AI_PROVIDER_2_SECRET }}
      DEEPSEEK_MODEL: deepseek-v4-flash
      DEEPSEEK_VISION_MODEL: deepseek-v4-flash-vision-exp
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_BEDROCK_MODEL_ID: ${{ vars.AWS_BEDROCK_MODEL_ID || 'us.amazon.nova-2-lite-v1:0' }}
      TARGET_BRANCH: ${{ github.ref_name }}
      TRIGGER_REASON: ${{ inputs.trigger_reason || 'manual' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
          check-latest: false

      - name: Evaluate current Founder queue deficit
        id: guard
        run: |
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'scripts')
          import maintain_approval_queue as q

          calendar = q.load_json('content/calendar.json', {'days': []})
          approvals = q.load_json('data/approvals.json', {})
          published = q.load_json('content/published.json', {})
          gates = q.load_json('data/gate_results.json', {'posts': {}})
          ready = len(q.approval_ready_ids(calendar, gates, approvals, published))
          target = q.queue_target()
          deficit = max(0, target - ready)
          refill = deficit > 0
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"refill_required={'true' if refill else 'false'}\n")
              f.write(f"approval_ready={ready}\n")
              f.write(f"target={target}\n")
              f.write(f"deficit={deficit}\n")
          print(json.dumps({
              'queue_mode': 'EVENT_DRIVEN_EXACT_DEFICIT',
              'trigger_reason': os.getenv('TRIGGER_REASON', 'manual'),
              'approval_ready': ready,
              'target': target,
              'deficit': deficit,
              'action': 'REFILL_EXACT_DEFICIT' if refill else 'IDLE_QUEUE_FULL'
          }))
          PY

      - name: Queue full - remain idle
        if: steps.guard.outputs.refill_required != 'true'
        run: |
          echo "AURA3 queue is ${{ steps.guard.outputs.approval_ready }}/${{ steps.guard.outputs.target }}. Production remains IDLE."

      - name: Install runtime dependencies
        if: steps.guard.outputs.refill_required == 'true'
        run: pip install boto3 pillow

      - name: Run visual acquisition unit tests
        if: steps.guard.outputs.refill_required == 'true'
        run: python -m unittest tests/test_refresh_image_pool.py -v

      - name: Validate provider rotation and resilience syntax
        if: steps.guard.outputs.refill_required == 'true'
        run: python -m py_compile scripts/aura3_resilient_queue.py scripts/aura3_nova_runtime.py scripts/provider_rotation.py scripts/run_image_validated_queue.py scripts/sanitize_image_pool.py scripts/refresh_image_pool.py

      - name: Validate image rulebook contract
        if: steps.guard.outputs.refill_required == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('governance/image_validation_rulebook.json').read_text())
          assert r['quality']['minimum_source_width'] == 1200
          assert r['quality']['minimum_source_height'] == 800
          assert r['quality']['minimum_visual_quality_score'] >= 7
          assert r['rights_and_legal']['commercial_use_required'] is True
          assert r['governance']['gemini_allowed'] is False
          print('AURA3_IMAGE_VALIDATION_RULEBOOK_OK')
          PY

      - name: Refresh and sanitize governed multi-source visual pool
        if: steps.guard.outputs.refill_required == 'true'
        run: |
          python scripts/refresh_image_pool.py
          python scripts/sanitize_image_pool.py

      - name: Adaptive second visual acquisition pass
        if: steps.guard.outputs.refill_required == 'true'
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          cfg=json.loads(Path('data/image_sources.json').read_text())
          health=json.loads(Path('data/image_pool_health.json').read_text())
          minimum=int(cfg.get('minimum_sanitized_pool_items',25))
          eligible=int(health.get('eligible_after',0))
          if eligible < minimum:
              print(f'Eligible pool {eligible} below {minimum}; running second governed acquisition pass.')
              subprocess.run(['python','scripts/refresh_image_pool.py'],check=True)
              subprocess.run(['python','scripts/sanitize_image_pool.py'],check=True)
          else:
              print(f'Eligible pool healthy: {eligible} >= {minimum}')
          PY

      - name: Normalize Founder disclosure standard
        if: steps.guard.outputs.refill_required == 'true'
        run: python scripts/normalize_disclosures.py

      - name: Refill exact Founder queue deficit with alternating provider
        id: maintain
        if: steps.guard.outputs.refill_required == 'true'
        shell: bash
        run: |
          set +e
          python scripts/run_image_validated_queue.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Reconcile partial refill safely
        if: steps.guard.outputs.refill_required == 'true'
        run: python scripts/reconcile_approval_queue.py

      - name: Validate queue truth contract
        if: steps.guard.outputs.refill_required == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rules=json.loads(Path('data/queue_rules.json').read_text())
          status=json.loads(Path('data/approval_queue_status.json').read_text())
          calendar=json.loads(Path('content/calendar.json').read_text())
          gates=json.loads(Path('data/gate_results.json').read_text())
          policy=json.loads(Path('governance/image_validation_rulebook.json').read_text())
          rotation=json.loads(Path('data/provider_rotation_state.json').read_text())
          health=json.loads(Path('data/image_pool_health.json').read_text())
          assert rules['max_pending_on_dashboard'] == 20
          assert rules['disclosure_standard'] == 'Inspiration reference'
          assert status['target'] == 20
          assert status['approval_ready'] <= 20
          assert status['disclosure_standard'] == 'Inspiration reference'
          assert gates.get('batch_complete') is True
          assert policy['governance']['gemini_allowed'] is False
          assert rotation.get('mode') == 'ALTERNATING_DEEPSEEK_NOVA'
          assert rotation.get('next_provider') in {'deepseek','nova'}
          assert health.get('eligible_after',0) >= 0
          pipeline=str(gates.get('pipeline',''))
          assert pipeline in {'DeepSeek Vision -> DeepSeek Business Gate','Amazon Nova Vision -> Amazon Nova Business Gate'}
          for post in calendar.get('days',[]):
              assert post.get('disclosure') == 'Inspiration reference'
          print(json.dumps({
              'queue_contract':'PASS',
              'event_driven':True,
              'approval_ready':status['approval_ready'],
              'target':20,
              'deficit':status.get('deficit'),
              'pipeline':pipeline,
              'provider_rotation':'ACTIVE',
              'next_provider':rotation.get('next_provider'),
              'sanitized_pool':health.get('eligible_after'),
              'image_rulebook':'ACTIVE'
          }))
          PY

      - name: Persist queue and visual-pool evidence
        if: steps.guard.outputs.refill_required == 'true'
        run: |
          git config user.name 'aura3-queue-maintainer'
          git config user.email 'aura3-queue-maintainer@users.noreply.github.com'
          git add content/calendar.json data/gate_results.json data/approval_queue_status.json data/image_pool.json data/image_pool_health.json data/image_acquisition_log.json data/dead_image_blacklist.json data/pipeline_incidents.json data/provider_rotation_state.json data/provider_comparison.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No queue, provider-rotation or visual-pool changes to persist.'
          else
            git commit -m "queue(aura3): event-driven refill (${TRIGGER_REASON})"
            git pull --rebase origin "$TARGET_BRANCH"
            git push origin HEAD:"$TARGET_BRANCH"
          fi

      - name: Enforce maintainer failures
        if: steps.guard.outputs.refill_required == 'true'
        env:
          EXIT_CODE: ${{ steps.maintain.outputs.exit_code }}
        run: |
          if [ "$EXIT_CODE" != "0" ]; then
            echo 'Queue refill encountered a provider/runtime failure. No autonomous self-dispatch will occur; next refill is event-driven.'
            exit "$EXIT_CODE"
          fi
