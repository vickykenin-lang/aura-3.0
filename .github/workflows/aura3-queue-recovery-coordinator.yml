name: AURA3 Queue Recovery Coordinator

on:
  push:
    branches: [main]
    paths:
      - 'data/image_sources.json'
      - 'scripts/refresh_image_pool.py'
      - '.github/workflows/aura3-approval-queue-maintainer.yml'
      - '.github/workflows/aura3-queue-recovery-coordinator.yml'
  schedule:
    - cron: '52 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: aura3-queue-recovery-coordinator
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY || secrets.UNSPLASH_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'

      - name: Probe stock-source health and decide one-shot recovery
        id: decide
        run: |
          python - <<'PY'
          import hashlib, json, os, urllib.parse, urllib.request
          from pathlib import Path

          status = json.loads(Path('data/approval_queue_status.json').read_text())
          sources_raw = Path('data/image_sources.json').read_bytes()
          config_sha = hashlib.sha256(sources_raw).hexdigest()
          target = int(status.get('target', 20))
          ready = int(status.get('approval_ready', 0))
          deficit = max(0, target - ready)
          queue_state = str(status.get('status', ''))

          def request_json(url, headers=None, timeout=12):
              req = urllib.request.Request(url, headers=headers or {})
              with urllib.request.urlopen(req, timeout=timeout) as resp:
                  return json.loads(resp.read().decode('utf-8'))

          health = {}

          pexels = os.getenv('PEXELS_API_KEY', '')
          if not pexels:
              health['pexels'] = 'CREDENTIAL_ABSENT'
          else:
              try:
                  q = urllib.parse.urlencode({'query':'modern office interior','per_page':1})
                  data = request_json('https://api.pexels.com/v1/search?' + q, {'Authorization': pexels, 'User-Agent':'AURA3-Recovery/1.0'})
                  health['pexels'] = 'HEALTHY' if data.get('photos') else 'EMPTY'
              except Exception as exc:
                  health['pexels'] = 'UNHEALTHY_' + type(exc).__name__

          pixabay = os.getenv('PIXABAY_API_KEY', '')
          if not pixabay:
              health['pixabay'] = 'CREDENTIAL_ABSENT'
          else:
              try:
                  q = urllib.parse.urlencode({'key':pixabay,'q':'modern office interior','image_type':'photo','per_page':3,'safesearch':'true'})
                  data = request_json('https://pixabay.com/api/?' + q, {'User-Agent':'AURA3-Recovery/1.0'})
                  health['pixabay'] = 'HEALTHY' if data.get('hits') else 'EMPTY'
              except Exception as exc:
                  health['pixabay'] = 'UNHEALTHY_' + type(exc).__name__

          unsplash = os.getenv('UNSPLASH_ACCESS_KEY', '')
          if not unsplash:
              health['unsplash'] = 'CREDENTIAL_ABSENT'
          else:
              try:
                  q = urllib.parse.urlencode({'query':'modern office interior','per_page':1})
                  data = request_json('https://api.unsplash.com/search/photos?' + q, {'Authorization':'Client-ID ' + unsplash, 'Accept-Version':'v1', 'User-Agent':'AURA3-Recovery/1.0'})
                  health['unsplash'] = 'HEALTHY' if data.get('results') else 'EMPTY'
              except Exception as exc:
                  health['unsplash'] = 'UNHEALTHY_' + type(exc).__name__

          all_healthy = all(health.get(x) == 'HEALTHY' for x in ('pexels','pixabay','unsplash'))
          state_path = Path('data/queue_recovery_state.json')
          previous = json.loads(state_path.read_text()) if state_path.exists() else {}
          previous_healthy = bool(previous.get('all_sources_healthy', False))
          previous_config_sha = str(previous.get('source_config_sha', ''))

          source_recovered = all_healthy and (not previous_healthy or previous_config_sha != config_sha)
          waiting_for_images = queue_state == 'QUEUE_WAITING_FOR_UNIQUE_IMAGES' or int(status.get('unique_pool_available', 0) or 0) == 0
          should_dispatch = deficit > 0 and waiting_for_images and source_recovered

          new_state = {
              'schema_version': 1,
              'mode': 'SOURCE_RECOVERY_ONE_SHOT',
              'all_sources_healthy': all_healthy,
              'source_health': health,
              'source_config_sha': config_sha,
              'queue_status': queue_state,
              'approval_ready': ready,
              'target': target,
              'deficit': deficit,
              'recovery_dispatch_required': should_dispatch,
              'truth_note': 'Recovery coordinator dispatches exactly once when governed stock sources transition from unavailable/unverified to healthy while the Founder queue is image-starved. Normal refill remains reject/publish driven.'
          }
          state_path.write_text(json.dumps(new_state, indent=2) + '\n')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('dispatch=' + ('true' if should_dispatch else 'false') + '\n')
              f.write('all_healthy=' + ('true' if all_healthy else 'false') + '\n')
              f.write(f'deficit={deficit}\n')

          safe_health = {k:v for k,v in health.items()}
          print(json.dumps({'mode':'SOURCE_RECOVERY_ONE_SHOT','health':safe_health,'all_healthy':all_healthy,'previous_healthy':previous_healthy,'source_recovered':source_recovered,'approval_ready':ready,'target':target,'deficit':deficit,'waiting_for_images':waiting_for_images,'dispatch':should_dispatch}, indent=2))
          PY

      - name: Persist recovery health transition
        run: |
          git config user.name 'aura3-recovery-coordinator'
          git config user.email 'aura3-recovery-coordinator@users.noreply.github.com'
          git add data/queue_recovery_state.json
          if git diff --cached --quiet; then
            echo 'Recovery state unchanged.'
          else
            git commit -m 'health(aura3): persist stock-source recovery state'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Dispatch one-shot queue recovery after source recovery
        if: steps.decide.outputs.dispatch == 'true'
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url = 'https://api.github.com/repos/vickykenin-lang/aura-3.0/actions/workflows/aura3-approval-queue-maintainer.yml/dispatches'
          payload = json.dumps({'ref':'main','inputs':{'trigger_reason':'stock_source_recovered'}}).encode('utf-8')
          req = urllib.request.Request(url, data=payload, method='POST', headers={
              'Authorization':'Bearer ' + os.environ['GH_TOKEN'],
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'Content-Type':'application/json',
              'User-Agent':'AURA3-Recovery/1.0'
          })
          with urllib.request.urlopen(req, timeout=15) as resp:
              if resp.status not in (201, 204):
                  raise SystemExit(f'UNEXPECTED_DISPATCH_STATUS_{resp.status}')
          print(json.dumps({'queue_recovery_dispatch':'ACCEPTED','trigger_reason':'stock_source_recovered'}))
          PY

      - name: Recovery coordinator truth contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('data/queue_recovery_state.json').read_text())
          assert s['mode'] == 'SOURCE_RECOVERY_ONE_SHOT'
          assert s['target'] == 20
          print(json.dumps({'recovery_contract':'PASS','all_sources_healthy':s['all_sources_healthy'],'deficit':s['deficit'],'dispatch_required':s['recovery_dispatch_required']}))
          PY
