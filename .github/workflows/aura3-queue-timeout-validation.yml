name: AURA3 Queue Timeout Validation

on:
  push:
    branches:
      - aura3-queue-timeout-resilience
    paths:
      - 'scripts/run_approval_queue.py'
      - 'tests/test_queue_timeout_resilience.py'
      - '.github/workflows/aura3-approval-queue-maintainer.yml'
      - '.github/workflows/aura3-queue-timeout-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Compile wrapper
        run: python -m py_compile scripts/run_approval_queue.py
      - name: Test raw timeout conversion and retry
        run: python -m unittest tests.test_queue_timeout_resilience -v
      - name: Verify maintainer uses resilient wrapper
        run: grep -F 'python scripts/run_approval_queue.py' .github/workflows/aura3-approval-queue-maintainer.yml
