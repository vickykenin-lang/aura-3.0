name: AURA3 Queue Timeout Validation

on:
  push:
    branches:
      - aura3-queue-timeout-resilience
      - aura3-queue-qualification-resilience
      - aura3-queue-prefer-working-gemini
    paths:
      - 'scripts/run_approval_queue.py'
      - 'scripts/maintain_approval_queue.py'
      - 'tests/test_queue_timeout_resilience.py'
      - '.github/workflows/aura3-approval-queue-maintainer.yml'
      - '.github/workflows/aura3-queue-timeout-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Compile queue resilience scripts
        run: python -m py_compile scripts/run_approval_queue.py scripts/maintain_approval_queue.py
      - name: Test generation and qualification timeout conversion
        run: python -m unittest tests.test_queue_timeout_resilience -v
      - name: Verify isolated qualification failures do not break the candidate loop
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('scripts/maintain_approval_queue.py').read_text(encoding='utf-8')
          assert 'Isolated provider/network failure must not discard the rest of the generated batch.' in text
          assert 'continue' in text
          print('isolated qualification failure contract PASS')
          PY
      - name: Verify maintainer uses resilient wrapper and preferred live-proven model
        run: |
          grep -F 'python scripts/run_approval_queue.py' .github/workflows/aura3-approval-queue-maintainer.yml
          grep -F 'GEMINI_MODEL: gemini-3.5-flash' .github/workflows/aura3-approval-queue-maintainer.yml
