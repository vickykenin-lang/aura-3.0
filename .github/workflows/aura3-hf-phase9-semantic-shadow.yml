name: AURA3 HF Phase 9 Semantic Shadow

on:
  push:
    branches: [hf-phase8-semantic-memory, main]
    paths:
      - 'evaluation/HF_PHASE9_DEPLOY_TRIGGER.json'
      - '.github/workflows/aura3-hf-phase9-semantic-shadow.yml'
      - 'scripts/build_hf_phase9_business_instrumentation.py'
      - 'scripts/verify_hf_phase9_business_instrumentation.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_HUB_DISABLE_TELEMETRY: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  semantic-shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
      - name: Verify semantic source contracts
        run: python -m unittest tests/test_hf_semantic_memory.py -v
      - name: Install exact CPU-only PyTorch
        run: python -m pip install --prefer-binary --index-url https://download.pytorch.org/whl/cpu 'torch==2.14.0+cpu'
      - name: Install isolated HF dependencies
        run: python -m pip install --prefer-binary -r hf/requirements-shadow.txt -c hf/constraints-shadow.txt
      - name: Execute semantic shadow scan
        run: python scripts/run_hf_phase8_semantic_pilot.py
      - name: Verify semantic evidence
        run: python scripts/verify_hf_phase8_semantic.py --input evaluation/results/hf-phase8-semantic-pilot.json
      - name: Build business-outcome instrumentation
        run: >-
          python scripts/build_hf_phase9_business_instrumentation.py
          --input evaluation/results/hf-phase8-semantic-pilot.json
          --output evaluation/results/hf-phase9-business-instrumentation.json
          --source-sha "${GITHUB_SHA}"
          --run-id "${GITHUB_RUN_ID}"
      - name: Verify instrumentation truth contract
        run: python scripts/verify_hf_phase9_business_instrumentation.py --input evaluation/results/hf-phase9-business-instrumentation.json
      - name: Upload Phase 9 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aura3-hf-phase9-semantic-shadow
          path: |
            evaluation/results/hf-phase8-semantic-pilot.json
            evaluation/results/hf-phase9-business-instrumentation.json
          if-no-files-found: warn
          retention-days: 7
