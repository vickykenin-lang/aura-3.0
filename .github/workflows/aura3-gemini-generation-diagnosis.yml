name: AURA3 Gemini Generation Diagnosis

on:
  push:
    branches: [aura3-gemini-generation-diagnosis]
    paths:
      - '.github/workflows/aura3-gemini-generation-diagnosis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-fallback:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GEMINI_API_KEY: ${{ secrets.AI_PROVIDER_1_SECRET }}
      GEMINI_MODEL: gemini-3.5-flash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Probe fallback credential without exposing it
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import generate_candidates as generator

          key=os.environ.get('GEMINI_API_KEY','').strip()
          if not key:
              print(json.dumps({'fallback_credential':'UNAVAILABLE'}))
              raise SystemExit(1)
          pool=json.loads(Path('data/image_pool.json').read_text())
          try:
              generated, model=generator.gemini_generate(key, pool[:1])
              print(json.dumps({'fallback_credential':'WORKING','model':model,'count':len(generated)}))
          except Exception as error:
              text=str(error)
              if 'dunning decision is deny' in text.lower() or ('HTTP 403' in text and 'PERMISSION_DENIED' in text):
                  reason='PROJECT_ACCESS_OR_BILLING_DENIED'
              elif 'HTTP 403' in text:
                  reason='PERMISSION_DENIED'
              elif 'HTTP 429' in text:
                  reason='RATE_LIMITED'
              else:
                  reason='PROVIDER_REQUEST_FAILED'
              print(json.dumps({'fallback_credential':'FAILED','reason':reason}))
              raise SystemExit(1)
          PY
