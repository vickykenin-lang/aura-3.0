name: AURA3 R11 Autopost

# Unattended Instagram posting for R11 Design Kits.
# GitHub's own cron fires only every few hours in this repo, so the Cloudflare Worker
# r11/workers/designinfra-autopost-cron dispatches this workflow (mode: publish) every hour.
# Job 1 "publish" needs only Python: it posts at most one due item whose kit was prepared
# earlier, so a slow apt mirror can never delay a post. Job 2 "content" then runs the content
# agent (keeps the next 48 h filled: 07:00 IST reel, 19:00 IST carousel) and builds + reviews
# kits (fonts, ffmpeg, OCR). Live posting happens only on main from the schedule (or a manual "publish"
# run); pushes and every other branch do a read-only dry run.
on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run checks everything without posting; publish posts the due item'
        type: choice
        options: [dry-run, publish]
        default: dry-run
  push:
    branches: ['main', 'r11/design-kit']
    paths:
      - 'r11/design_kit/**'
      - 'r11/workers/**'
      - '.github/workflows/aura3-r11-autopost.yml'

permissions:
  contents: write
  id-token: write   # GitHub OIDC token: the only credential the content-studio Worker accepts

concurrency:
  group: aura3-r11-autopost-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # latest branch head, not the triggering commit: a queued run must see the
          # publish record written by the run before it
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
      - name: Python dependencies (no apt on the posting path)
        run: python -m pip install 'pillow>=11.3,<13'
      - name: Publish due item (A6)
        env:
          IG_TOKEN: ${{ secrets.IG_AURA3_TOKEN }}
          IG_ID: ${{ secrets.IG_AURA3_ID }}
          LIVE: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.mode == 'publish') }}
        run: |
          flag="--dry-run --preview-next"
          if [ "$LIVE" = "true" ]; then flag=; fi
          python r11/design_kit/autopost.py publish $flag --commit "$(git rev-parse HEAD)"
      - name: Record result
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add r11/design_kit/published.json
          if ! git diff --cached --quiet; then
            git commit -q -m "R11 autopost: record publish result"
            for i in 1 2 3 4; do
              git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && break
              sleep $((i * 5))
            done
          fi

  content:
    needs: publish
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
      - name: Restore cached system packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        with:
          path: ~/r11-debs
          key: r11-debs-noble-v1
      - name: Install fonts, ffmpeg, OCR and Python dependencies
        timeout-minutes: 20   # a stuck apt mirror must not eat the whole run
        run: |
          # .deb files are kept in ~/r11-debs (GitHub cache): apt only downloads what is missing or newer
          mkdir -p ~/r11-debs/partial
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Dir::Cache::archives=$HOME/r11-debs/"
          for i in 1 2 3; do
            timeout 240 sudo apt-get $APT update -q &&
            timeout 420 sudo apt-get $APT install -y -q --no-install-recommends fonts-inter ffmpeg tesseract-ocr tesseract-ocr-eng &&
            break
            echo "apt attempt $i failed, retrying"; sleep 15
          done
          sudo rm -rf ~/r11-debs/partial ~/r11-debs/lock
          sudo chown -R "$(id -u):$(id -g)" ~/r11-debs
          command -v ffmpeg && command -v tesseract && test -f /usr/share/fonts/opentype/inter/Inter-Regular.otf
          python -m pip install 'pillow>=11.3,<13' 'numpy>=2,<3' boto3
      - name: Offline tests
        run: python -m unittest r11/design_kit/test_design_kit.py r11/design_kit/test_autopost.py r11/design_kit/test_content_agent.py
      - name: Content agent (A1 concept + A2 kit author)
        # main only: the AI image quota is shared and tiny, a test branch must not spend it
        if: github.ref == 'refs/heads/main'
        continue-on-error: true   # a failed concept is logged; posting what is ready still goes ahead
        run: python r11/design_kit/content_agent.py
      - name: Prepare kits (A5 build + A4 review)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          AWS_BEDROCK_MODEL_ID: ${{ vars.AWS_BEDROCK_MODEL_ID || 'us.amazon.nova-2-lite-v1:0' }}
        run: python r11/design_kit/autopost.py prepare --nova
      - name: Commit prepared kits
        id: kits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for p in campaigns/r11/kits campaigns/r11/concepts r11/design_kit/kits r11/design_kit/schedule.json r11/design_kit/concepts.json r11/design_kit/drafts; do
            if [ -e "$p" ]; then git add -A "$p"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -q -m "R11 autopost: new content + build + review kits"
            for i in 1 2 3 4; do
              git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && break
              sleep $((i * 5))
            done
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
