name: AURA3 Read-Only Provider Diagnostic
on:
  push:
    branches: [main]
    paths: ['scripts/diagnose_deepseek_access.py', '.github/workflows/aura3-provider-access-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
      - name: Read model availability without inference
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || secrets.DEEPSEEK_KEY || secrets.AI_PROVIDER_2_SECRET }}
          DEEPSEEK_MODEL: deepseek-flash
          DEEPSEEK_VISION_MODEL: deepseek-flash
        run: python scripts/diagnose_deepseek_access.py
      - name: Retain sanitized diagnostic
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aura3-provider-access-diagnostic
          path: evaluation/results/aura3-deepseek-read-only-diagnostic.json
          retention-days: 7
