name: AURA3 Founder Approval

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      command:
        description: "approve or reject"
        required: true
        type: choice
        options: [approve, reject]
      post_id:
        description: "AURA3 post id"
        required: true
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: aura3-founder-approval
  cancel-in-progress: false

jobs:
  founder-command:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue.user.login == github.repository_owner &&
        (
          startsWith(github.event.issue.title, 'APPROVE ') ||
          startsWith(github.event.issue.title, 'REJECT ')
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'

      - name: Parse Founder command
        id: command
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          INPUT_COMMAND: ${{ inputs.command }}
          INPUT_POST_ID: ${{ inputs.post_id }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            action="$(printf '%s' "$INPUT_COMMAND" | tr '[:upper:]' '[:lower:]')"
            post_id="$INPUT_POST_ID"
          else
            action="$(printf '%s' "$ISSUE_TITLE" | awk '{print tolower($1)}')"
            post_id="$(printf '%s' "$ISSUE_TITLE" | awk '{print $2}')"
          fi
          case "$action" in approve|reject) ;; *) echo "Unsupported action"; exit 1;; esac
          if ! printf '%s' "$post_id" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "Invalid post id"
            exit 1
          fi
          python3 - "$post_id" <<'PY'
          import json, sys
          post_id = sys.argv[1]
          calendar = json.load(open('content/calendar.json', encoding='utf-8'))
          if not any(p.get('id') == post_id for p in calendar.get('days', [])):
              raise SystemExit(f'Unknown current-calendar post id: {post_id}')
          PY
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "post_id=$post_id" >> "$GITHUB_OUTPUT"

      - name: Approve strict-gate post
        if: steps.command.outputs.action == 'approve'
        env:
          POST_ID: ${{ steps.command.outputs.post_id }}
        run: python3 scripts/approve_manual.py

      - name: Record rejection
        if: steps.command.outputs.action == 'reject'
        env:
          POST_ID: ${{ steps.command.outputs.post_id }}
        run: |
          python3 - <<'PY'
          import json, os
          post_id = os.environ['POST_ID']
          with open('content/published.json', encoding='utf-8') as f:
              published = json.load(f)
          if post_id in published:
              raise SystemExit('REFUSED: published post cannot be retroactively rejected')
          with open('data/approvals.json', encoding='utf-8') as f:
              approvals = json.load(f)
          approvals[post_id] = 'rejected'
          with open('data/approvals.json', 'w', encoding='utf-8') as f:
              json.dump(approvals, f, indent=2, ensure_ascii=False)
              f.write('\n')
          print(f'REJECTED: {post_id}')
          PY

      - name: Persist approval decision
        env:
          ACTION: ${{ steps.command.outputs.action }}
          POST_ID: ${{ steps.command.outputs.post_id }}
        run: |
          git config user.name "aura3-founder-approval"
          git config user.email "aura3-founder-approval@users.noreply.github.com"
          git add -- data/approvals.json
          if ! git diff --staged --quiet; then
            git commit -m "Founder ${ACTION} ${POST_ID}"
            git push
          fi

      - name: Close Founder command issue
        if: success() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ACTION: ${{ steps.command.outputs.action }}
          POST_ID: ${{ steps.command.outputs.post_id }}
        run: gh issue close "$ISSUE_NUMBER" --comment "AURA3 recorded Founder ${ACTION} for ${POST_ID}. Dashboard will refresh automatically."

      - name: Report failed Founder command
        if: failure() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --body "AURA3 refused this approval command. No approval state was changed; inspect the sanitized Actions log."
