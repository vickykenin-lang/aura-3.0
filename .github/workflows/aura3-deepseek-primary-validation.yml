name: AURA3 DeepSeek Primary Validation

on:
  push:
    branches: [aura3-revalidate-legacy-visual-gates]
    paths:
      - 'scripts/run_deepseek_primary.py'
      - '.github/workflows/aura3-approval-queue-maintainer.yml'
      - '.github/workflows/aura3-deepseek-primary-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-provider-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: deepseek-v4-flash
      DEEPSEEK_VISION_MODEL: deepseek-v4-flash-vision-exp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'

      - name: Verify production workflow provider routing
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow=Path('.github/workflows/aura3-approval-queue-maintainer.yml').read_text()
          assert 'python scripts/run_deepseek_primary.py' in workflow
          assert 'DEEPSEEK_API_KEY:' in workflow
          assert 'DEEPSEEK_MODEL: deepseek-v4-flash' in workflow
          assert 'DEEPSEEK_VISION_MODEL: deepseek-v4-flash-vision-exp' in workflow
          assert 'GEMINI_API_KEY:' not in workflow
          assert 'DeepSeek Vision -> DeepSeek Business Gate' in workflow
          print('AURA3_PRODUCTION_ROUTING_DEEPSEEK_TEXT_AND_VISION_OK')
          PY

      - name: Verify DeepSeek secret reference
        run: |
          test -n "$DEEPSEEK_API_KEY" || (echo 'DEEPSEEK_API_KEY missing' && exit 1)

      - name: Live DeepSeek text and vision model preflight
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, 'scripts')
          import run_deepseek_primary as d
          models=d.deepseek_provider_preflight(os.environ['DEEPSEEK_API_KEY'])
          assert os.environ['DEEPSEEK_MODEL'] in models
          assert os.environ['DEEPSEEK_VISION_MODEL'] in models
          print('AURA3_DEEPSEEK_TEXT_AND_VISION_PREFLIGHT_OK')
          PY

      - name: Live DeepSeek generation smoke test
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import run_deepseek_primary as d
          sample=[{'photo_tag':'office','angle':'premium turnkey office interior'}]
          items, model=d.deepseek_generate('', sample)
          assert len(items)==1
          assert items[0].get('hook_en') and items[0].get('caption_hi')
          print('AURA3_DEEPSEEK_GENERATION_OK', model)
          PY

      - name: Live DeepSeek Vision smoke test on governed production image
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import run_deepseek_primary as d
          calendar=json.loads(Path('content/calendar.json').read_text())
          post=calendar['days'][-1]
          vision=d.deepseek_vision(os.environ['DEEPSEEK_API_KEY'], post['image'])
          assert vision['model'] == os.environ['DEEPSEEK_VISION_MODEL']
          assert vision['room_type'] in d.VISION_ROOMS
          assert 0 <= vision['quality'] <= 10
          assert isinstance(vision['visual_ok'], bool)
          print(json.dumps({'AURA3_DEEPSEEK_VISION_OK': True, 'post_id':post['id'], 'room_type':vision['room_type'], 'quality':vision['quality'], 'visual_ok':vision['visual_ok'], 'model':vision['model']}))
          PY

      - name: Run full production queue path and legacy visual revalidation without publishing
        run: |
          python scripts/run_deepseek_primary.py

      - name: Verify no pending temporary metadata visual gates remain
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          import maintain_approval_queue as m

          calendar=json.loads(Path('content/calendar.json').read_text())
          approvals=json.loads(Path('data/approvals.json').read_text())
          published=json.loads(Path('content/published.json').read_text())
          gates=json.loads(Path('data/gate_results.json').read_text())
          post_gates=gates.get('posts') or {}
          offenders=[]
          approval_ready=[]
          for post in calendar.get('days',[]):
              post_id=str(post.get('id','')).strip()
              if not post_id or m.is_published(published, post_id) or m.approval_state(approvals, post_id) != 'pending':
                  continue
              gate=post_gates.get(post_id) or {}
              vision=gate.get('vision') or {}
              model=str(vision.get('model') or '').strip()
              if model in {'', 'CURATED_METADATA_GATE'}:
                  offenders.append(post_id)
              if m.gate_passed(gate):
                  approval_ready.append(post_id)
          assert offenders == [], offenders
          assert len(approval_ready) == 20, approval_ready
          summary=gates.get('legacy_visual_revalidation') or {}
          assert summary.get('status') == 'COMPLETE', summary
          print(json.dumps({'legacy_visual_revalidation':'PASS','revalidated':summary.get('revalidated',0),'passed':summary.get('passed',0),'rejected':summary.get('rejected',0),'approval_ready':len(approval_ready),'temporary_gate_offenders':offenders}))
          PY

      - name: Verify production queue truth contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          status=json.loads(Path('data/approval_queue_status.json').read_text())
          gates=json.loads(Path('data/gate_results.json').read_text())
          calendar=json.loads(Path('content/calendar.json').read_text())
          assert status.get('technical_errors') == [], status
          assert status.get('target') == 20, status
          assert status.get('approval_ready') == 20, status
          assert gates.get('pipeline') == 'DeepSeek Vision -> DeepSeek Business Gate', gates
          assert gates.get('vision_models') == ['deepseek-v4-flash-vision-exp'], gates
          assert gates.get('business_model') == 'deepseek-v4-flash', gates
          assert calendar.get('generator') == 'DeepSeek deepseek-v4-flash rolling queue maintainer', calendar.get('generator')
          print(json.dumps({
              'production_path':'PASS',
              'status':status.get('status'),
              'approval_ready':status.get('approval_ready'),
              'target':status.get('target'),
              'text_model':'deepseek-v4-flash',
              'vision_model':'deepseek-v4-flash-vision-exp'
          }))
          PY
