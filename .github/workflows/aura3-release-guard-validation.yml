name: AURA3 Release Guard Validation

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'runtime/guarded_execution.py'
      - 'tests/**'
      - 'index.html'
      - 'governance/publishing_target.json'
      - '.github/workflows/**'
  push:
    branches: ['codex/aura3-release-guards-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
      - name: Install image-decoding test dependency
        run: python -m pip install 'pillow>=11.3,<13'
      - name: Check release, approval and account boundaries without social requests
        run: |
          python -m unittest discover -s tests -p 'test_release_guard.py' -v
          python -m unittest discover -s tests -p 'test_release_pipeline_binding.py' -v
          python -m unittest discover -s tests -p 'test_provider_diagnostics.py' -v
          python -m unittest discover -s tests -p 'test_publish_instagram.py' -v
          python -m unittest discover -s tests -p 'test_approve_manual.py' -v
          python -m unittest discover -s tests -p 'test_approval_dashboard_contract.py' -v
          python -m unittest discover -s tests -p 'test_score_with_deepseek.py' -v
          python - <<'PY'
          import runpy
          tests = runpy.run_path('tests/test_governance_contract.py')
          for name, function in tests.items():
              if name.startswith('test_') and callable(function):
                  function()
                  print(name + ': PASS')
          PY
