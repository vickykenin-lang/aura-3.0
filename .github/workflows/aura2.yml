name: AURA2 Founder Approval

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      post_id:
        description: "Dual-gate-passed post id"
        required: true
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: aura2-repo-write
  cancel-in-progress: false

jobs:
  founder-command:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue.user.login == github.repository_owner &&
        (
          startsWith(github.event.issue.title, 'APPROVE ') ||
          startsWith(github.event.issue.title, 'REJECT ')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Parse and validate command
        id: command
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          DISPATCH_POST_ID: ${{ inputs.post_id }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            action="approve"
            post_id="$DISPATCH_POST_ID"
          else
            action="$(printf '%s' "$ISSUE_TITLE" | awk '{print tolower($1)}')"
            post_id="$(printf '%s' "$ISSUE_TITLE" | awk '{print $2}')"
          fi
          if [ -z "$post_id" ]; then
            echo "Post id is required"
            exit 1
          fi
          python3 - "$post_id" <<'PY'
          import json, sys
          post_id = sys.argv[1]
          calendar = json.load(open("content/calendar.json", encoding="utf-8"))
          ids = {post.get("id") for post in calendar.get("days", [])}
          if post_id not in ids:
              raise SystemExit(f"Unknown current-calendar post id: {post_id}")
          PY
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "post_id=$post_id" >> "$GITHUB_OUTPUT"

      - name: Record permanent rejection
        if: steps.command.outputs.action == 'reject'
        env:
          POST_ID: ${{ steps.command.outputs.post_id }}
        run: |
          python3 - <<'PY'
          import json, os
          path = "data/approvals.json"
          data = json.load(open(path, encoding="utf-8"))
          data[os.environ["POST_ID"]] = "rejected"
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(data, handle, indent=2, ensure_ascii=False)
              handle.write("\n")
          PY
          git config user.name "aura2-approval"
          git config user.email "aura2-approval@users.noreply.github.com"
          git add -- data/approvals.json
          if ! git diff --staged --quiet; then
            git commit -m "Reject ${POST_ID}"
            git push
          fi

      - name: Approve strict-gate post for Instagram publishing
        if: steps.command.outputs.action == 'approve'
        env:
          POST_ID: ${{ steps.command.outputs.post_id }}
        run: |
          python3 scripts/approve_manual.py
          git config user.name "aura2-approval"
          git config user.email "aura2-approval@users.noreply.github.com"
          git add -- data/approvals.json
          if ! git diff --staged --quiet; then
            git commit -m "Approve ${POST_ID} for Instagram publish"
            git push
          fi

      - name: Publish approved post to Instagram
        id: instagram_publish
        if: steps.command.outputs.action == 'approve'
        env:
          POST_ID: ${{ steps.command.outputs.post_id }}
          IG_AURA2_TOKEN: ${{ secrets.IG_AURA2_TOKEN }}
          IG_AURA2_ID: ${{ secrets.IG_AURA2_ID }}
          IG_GRAPH_API_VERSION: v25.0
        run: |
          set +e
          output="$(python3 scripts/publish_instagram.py 2>&1)"
          status=$?
          printf '%s\n' "$output"
          reason=""
          if [ "$status" -ne 0 ]; then
            case "$output" in
              *"IG_AURA2_TOKEN and IG_AURA2_ID secrets are required"*)
                reason="Expected GitHub Actions secrets IG_AURA2_TOKEN and IG_AURA2_ID are missing."
                ;;
              *"Instagram API error 190"*)
                reason="Meta rejected IG_AURA2_TOKEN. Generate a valid publishing token for the linked Professional account."
                ;;
              *"Instagram API error 100/33"*)
                reason="Meta cannot access IG_AURA2_ID with this token. Verify the linked Instagram Professional account ID and permissions."
                ;;
              *"container creation failed"*)
                reason="Meta refused media-container creation. Verify account linking, publishing permissions, and public image access."
                ;;
              *)
                reason="Instagram publishing failed after approval. Inspect the sanitized Action log."
                ;;
            esac
            printf 'failure_reason=%s\n' "$reason" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      - name: Record verified Instagram publication
        if: steps.command.outputs.action == 'approve'
        env:
          POST_ID: ${{ steps.command.outputs.post_id }}
        run: |
          git config user.name "aura2-publisher"
          git config user.email "aura2-publisher@users.noreply.github.com"
          git add -- content/published.json data/approvals.json
          if ! git diff --staged --quiet; then
            git commit -m "Record Instagram publication for ${POST_ID}"
            git push
          fi

      - name: Close handled Founder issue
        if: success() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ACTION: ${{ steps.command.outputs.action }}
          POST_ID: ${{ steps.command.outputs.post_id }}
        run: gh issue close "$ISSUE_NUMBER" --comment "AURA2 handled $ACTION for $POST_ID. Approved posts are published automatically and verified by media ID."

      - name: Report failed Founder issue
        if: failure() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          FAILURE_REASON: ${{ steps.instagram_publish.outputs.failure_reason }}
        run: |
          reason="${FAILURE_REASON:-Instagram publishing was not confirmed.}"
          gh issue comment "$ISSUE_NUMBER" --body "AURA2 command failed. $reason Approval remains recorded; no publication is confirmed."
