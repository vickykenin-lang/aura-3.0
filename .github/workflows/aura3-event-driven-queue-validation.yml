name: AURA3 Event-Driven Queue Validation

on:
  push:
    branches:
      - aura3-event-driven-stabilization
      - aura3-self-healing-cleanup-v2
    paths:
      - 'scripts/queue_retry_controller.py'
      - 'scripts/aura3_image_cleanup_runtime.py'
      - 'scripts/provider_rotation.py'
      - 'tests/test_queue_retry_controller.py'
      - 'tests/test_refresh_image_pool.py'
      - 'tests/test_image_cleanup_runtime.py'
      - '.github/workflows/aura3-approval-queue-maintainer.yml'
      - '.github/workflows/aura3-founder-approval.yml'
      - '.github/workflows/aura3-instagram-publish.yml'
      - '.github/workflows/aura3-hf-phase10-business-outcome.yml'
      - '.github/workflows/aura3-queue-watchdog.yml'
      - '.github/workflows/aura3-queue-recovery-coordinator.yml'
      - '.github/workflows/aura3-event-driven-queue-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/queue_retry_controller.py'
      - 'scripts/aura3_image_cleanup_runtime.py'
      - 'scripts/provider_rotation.py'
      - 'tests/test_queue_retry_controller.py'
      - 'tests/test_refresh_image_pool.py'
      - 'tests/test_image_cleanup_runtime.py'
      - '.github/workflows/aura3-approval-queue-maintainer.yml'
      - '.github/workflows/aura3-founder-approval.yml'
      - '.github/workflows/aura3-instagram-publish.yml'
      - '.github/workflows/aura3-hf-phase10-business-outcome.yml'
      - '.github/workflows/aura3-queue-watchdog.yml'
      - '.github/workflows/aura3-queue-recovery-coordinator.yml'
      - '.github/workflows/aura3-event-driven-queue-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'

      - name: Install visual-test dependency
        run: pip install pillow

      - name: Compile queue scripts
        run: python -m py_compile scripts/queue_retry_controller.py scripts/refresh_image_pool.py scripts/sanitize_image_pool.py scripts/aura3_image_cleanup_runtime.py scripts/provider_rotation.py scripts/run_image_validated_queue.py

      - name: Run required unit tests
        run: python -m unittest tests/test_refresh_image_pool.py tests/test_queue_retry_controller.py tests/test_image_cleanup_runtime.py -v

      - name: Validate event-driven workflow contract
        run: |
          python - <<'PY'
          from pathlib import Path

          maint = Path('.github/workflows/aura3-approval-queue-maintainer.yml').read_text()
          approval = Path('.github/workflows/aura3-founder-approval.yml').read_text()
          publish = Path('.github/workflows/aura3-instagram-publish.yml').read_text()
          watchdog = Path('.github/workflows/aura3-queue-watchdog.yml').read_text()
          recovery = Path('.github/workflows/aura3-queue-recovery-coordinator.yml').read_text()
          rotation = Path('scripts/provider_rotation.py').read_text()
          cleanup = Path('scripts/aura3_image_cleanup_runtime.py').read_text()

          assert 'workflow_run:' not in maint
          assert 'schedule:' not in maint
          assert 'refill_required' in maint and 'IDLE_QUEUE_FULL' in maint
          assert "steps.command.outputs.action == 'reject'" in approval
          assert 'Trigger queue refill after rejection only' in approval
          assert 'aura3-approval-queue-maintainer.yml' in publish
          assert 'aura3-hf-phase10-business-outcome.yml' in publish
          assert 'Dispatch independent post-publish consumers' in publish

          # The hourly health watchdog remains strictly read-only.
          assert "cron: '17 * * * *'" in watchdog
          assert 'contents: read' in watchdog
          assert 'generation_called' in watchdog and 'False' in watchdog
          assert 'queue_refill_dispatched' in watchdog and 'False' in watchdog
          assert 'run_image_validated_queue.py' not in watchdog
          assert 'refresh_image_pool.py' not in watchdog

          # Stock-source recovery remains one-shot and bounded.
          assert 'SOURCE_RECOVERY_ONE_SHOT' in recovery
          assert "cron: '52 * * * *'" in recovery
          assert 'actions: write' in recovery
          assert 'PEXELS_API_KEY' in recovery and 'PIXABAY_API_KEY' in recovery and 'UNSPLASH_ACCESS_KEY' in recovery
          assert 'stock_source_recovered' in recovery
          assert 'previous_healthy' in recovery and 'source_recovered' in recovery
          assert 'run_image_validated_queue.py' not in recovery
          assert 'python scripts/refresh_image_pool.py' not in recovery
          assert 'aura3-approval-queue-maintainer.yml/dispatches' in recovery

          # Watermark/logo cleanup is edit-before-reject, followed by mandatory strict revalidation.
          assert 'RUNWAYML_API_SECRET' in maint
          assert 'aura3_image_cleanup_runtime.py' in maint
          assert 'assets/cleaned' in maint
          assert 'image_cleanup.install_into_resilient_runtime(resilient)' in rotation
          assert 'IMG_CLEANUP_REVALIDATED_PASS' in cleanup
          assert 'cleaned=original_strict(api_key,provider_url)' in cleanup
          assert 'cleanup candidate retained as visual reject' in cleanup
          assert '_cleanup_candidate' in cleanup
          print('AURA3_EVENT_DRIVEN_QUEUE_AND_CLEANUP_CONTRACT_PASS')
          PY
