name: AURA3 HF Phase 10 Business Outcome Gate

on:
  workflow_dispatch:
  push:
    branches: [hf-phase10-business-outcome-gate, main]
    paths:
      - 'evaluation/HF_PHASE10_GATE_TRIGGER.json'
      - 'data/hf_business_outcomes.json'
      - 'content/published.json'
      - 'state/department_state.json'
      - 'evaluation/HF_PHASE9_SEMANTIC_DEPLOYMENT_STATUS.json'
      - 'governance/hf_business_outcome_gate.json'
      - 'scripts/sync_hf_measurement_window.py'
      - 'scripts/evaluate_hf_phase10_business_outcome.py'
      - 'scripts/verify_hf_phase10_business_outcome.py'
      - 'tests/test_hf_phase10_business_outcome.py'
      - '.github/workflows/aura3-hf-phase10-business-outcome.yml'

permissions:
  contents: write

concurrency:
  group: aura3-hf-phase10-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  business-outcome-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
      - name: Run Phase 10 unit tests
        run: python -m unittest tests/test_hf_phase10_business_outcome.py -v
      - name: Validate Phase 10 scripts
        run: python -m py_compile scripts/sync_hf_measurement_window.py scripts/evaluate_hf_phase10_business_outcome.py scripts/verify_hf_phase10_business_outcome.py
      - name: Synchronize measurement window from canonical publication evidence
        run: python scripts/sync_hf_measurement_window.py
      - name: Evaluate current real-world business evidence
        run: python scripts/evaluate_hf_phase10_business_outcome.py
      - name: Verify Phase 10 truth contract
        run: python scripts/verify_hf_phase10_business_outcome.py --input evaluation/results/hf-phase10-business-outcome.json
      - name: Persist measurement and gate status
        run: |
          git config user.name 'aura3-phase10'
          git config user.email 'aura3-phase10@users.noreply.github.com'
          git add data/hf_business_outcomes.json evaluation/HF_PHASE10_BUSINESS_OUTCOME_STATUS.json evaluation/results/hf-phase10-business-outcome.json
          if git diff --cached --quiet; then
            echo 'No Phase 10 evidence changes to persist.'
          else
            git commit -m 'measure(aura3): sync Phase10 publication evidence'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
      - name: Upload Phase 10 gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aura3-hf-phase10-business-outcome-gate
          path: evaluation/results/hf-phase10-business-outcome.json
          if-no-files-found: warn
          retention-days: 7
