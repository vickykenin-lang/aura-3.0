name: AURA3 First Post Readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/check_first_post_readiness.py'
      - 'tests/test_first_post_readiness.py'
      - 'campaigns/r11/first-post.json'
      - 'campaigns/r11/first-post.png'
      - '.github/workflows/aura3-first-post-readiness.yml'

permissions:
  contents: write

concurrency:
  group: aura3-first-post-readiness
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
      - name: Install image verification dependency
        run: python -m pip install 'pillow>=11.3,<13'
      - name: Verify release guards and read-only probes offline
        run: |
          python -m unittest discover -s tests -p 'test_release_guard.py' -q
          python -m unittest discover -s tests -p 'test_publish_instagram.py' -q
          python -m unittest discover -s tests -p 'test_first_post_readiness.py' -q
      - name: Check actual image, exact caption and read-only publishing access
        id: probe
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || secrets.DEEPSEEK_KEY || secrets.AI_PROVIDER_2_SECRET }}
          IG_TOKEN: ${{ secrets.IG_AURA3_TOKEN }}
          IG_ID: ${{ secrets.IG_AURA3_ID }}
          OFFLINE_GUARDS_PASSED: 'true'
        run: python scripts/check_first_post_readiness.py
      - name: Upload exact readiness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aura3-first-post-readiness
          path: |
            certification/evidence/first-post-readiness.json
            certification/evidence/live-certification.json
            runtime/heartbeat_state.json
            runtime/provider_qualification.json
            runtime/capability_qualification.json
      - name: Persist observed evidence without enabling external execution
        if: always() && steps.probe.outcome != 'skipped'
        run: |
          test -f certification/evidence/first-post-readiness.json
          test -f certification/evidence/live-certification.json
          git config user.name 'AURA3 readiness evidence'
          git config user.email 'aura3-readiness@users.noreply.github.com'
          git add certification/evidence/first-post-readiness.json certification/evidence/live-certification.json runtime/heartbeat_state.json runtime/provider_qualification.json runtime/capability_qualification.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record actual first-post QA and fresh diagnostic certification'
          git push origin HEAD:main
