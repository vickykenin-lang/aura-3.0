name: AURA2 Quality Gate (DeepSeek)

on:
  workflow_dispatch:
  schedule:
    # 06:30 IST ≈ 01:00 UTC
    - cron: "0 1 * * *"

permissions:
  contents: write

jobs:
  deepseek-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run DeepSeek quality gate
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
        run: |
          python3 scripts/score_with_deepseek.py

      - name: Commit gate results
        run: |
          git config user.name "aura2-gate"
          git config user.email "aura2-gate@users.noreply.github.com"
          git add data/gate_results.json data/business_report.json
          git diff --staged --quiet || git commit -m "chore: DeepSeek quality gate results"
          git push
