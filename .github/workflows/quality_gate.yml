name: AURA2 Dual Quality Gate

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aura2-repo-write
  cancel-in-progress: false

jobs:
  dual-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Gemini visual check and DeepSeek business gate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
        run: python3 scripts/score_with_deepseek.py

      - name: Commit gate results
        run: |
          git config user.name "aura2-gate"
          git config user.email "aura2-gate@users.noreply.github.com"
          git add -- data/gate_results.json data/business_report.json
          git diff --staged --quiet || git commit -m "chore: refresh AURA2 dual-gate results"
          git diff --staged --quiet
          git push
