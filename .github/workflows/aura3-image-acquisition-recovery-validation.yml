name: AURA3 Stock Source Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/refresh_image_pool.py'
      - 'data/image_sources.json'
      - 'tests/test_refresh_image_pool.py'
      - 'tests/test_refresh_image_pool_recovery.py'
      - '.github/workflows/aura3-approval-queue-maintainer.yml'
      - '.github/workflows/aura3-image-acquisition-recovery-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY || secrets.UNSPLASH_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
      - run: pip install pillow
      - name: Run acquisition tests
        run: python -m unittest tests/test_refresh_image_pool.py tests/test_refresh_image_pool_recovery.py -v
      - name: Compile acquisition layer
        run: python -m py_compile scripts/refresh_image_pool.py scripts/sanitize_image_pool.py
      - name: Validate source policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('data/image_sources.json').read_text())
          ids=[s['id'] for s in cfg['sources'] if s.get('enabled',True)]
          assert ids == ['pexels','pixabay','unsplash'], ids
          assert cfg['commercial_use_policy'] == 'SOURCE_LICENSE_COMMERCIAL_USE_REQUIRED'
          assert set(cfg['allowed_source_licenses']) == {'Pexels License','Pixabay Content License','Unsplash License'}
          print(json.dumps({'source_policy':'PASS','active_sources':ids}))
          PY
      - name: Conditional live stock source probes
        run: |
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0,'scripts')
          import refresh_image_pool as r
          cfg=json.load(open('data/image_sources.json'))
          search={'query':'modern office interior','photo_tag':'office','angle':'current office planning'}
          results={}
          for source in cfg['sources']:
              sid=source['id']
              key=os.getenv(source['credential_env'],'')
              if not key:
                  results[sid]={'status':'NOT_VERIFIED_CREDENTIAL_ABSENT'}
                  continue
              rows,_=r._query_source(cfg,source,search,1)
              admitted=[r._stock_item(cfg,source,search,row) for row in rows]
              admitted=[x for x in admitted if x]
              results[sid]={'status':'PASS','rows':len(rows),'admitted':len(admitted)}
              if not admitted:
                  raise SystemExit(f'{sid.upper()}_ZERO_ADMITTED_CANDIDATES')
          print(json.dumps({'live_stock_source_probes':results}))
          PY
