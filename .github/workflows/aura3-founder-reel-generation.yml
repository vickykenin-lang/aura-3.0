name: AURA3 Founder Reel Generation

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      post_id:
        description: "AURA3 post id to convert into Reel"
        required: true
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: aura3-founder-reel-generation
  cancel-in-progress: false

jobs:
  generate-reel:
    if: >-
      (
        github.event_name == 'workflow_dispatch' &&
        (github.actor == github.repository_owner || github.actor == 'optimusprime2026vol1')
      ) ||
      (
        github.event_name == 'issues' &&
        (github.event.issue.user.login == github.repository_owner || github.event.issue.user.login == 'optimusprime2026vol1') &&
        startsWith(github.event.issue.title, 'REEL_GENERATE ')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RUNWAYML_API_SECRET: ${{ secrets.RUNWAYML_API_SECRET }}
      AURA3_REEL_MODEL: h3_max
      AURA3_REEL_DURATION: '8'
      AURA3_REEL_RATIO: '768:1280'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'

      - name: Resolve Founder Reel request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          INPUT_POST_ID: ${{ inputs.post_id }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            post_id="$INPUT_POST_ID"
          else
            post_id="$(printf '%s' "$ISSUE_TITLE" | awk '{print $2}')"
          fi
          if ! printf '%s' "$post_id" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo 'Invalid post id'
            exit 1
          fi
          echo "post_id=$post_id" >> "$GITHUB_OUTPUT"

      - name: Verify Runway credential is available
        run: |
          python - <<'PY'
          import os
          secret=(os.getenv('RUNWAYML_API_SECRET') or '').strip()
          if not secret:
              raise SystemExit('RUNWAYML_API_SECRET unavailable')
          print('RUNWAYML_API_SECRET_AVAILABLE=true')
          PY

      - name: Compile Reel generator
        run: python -m py_compile scripts/aura3_reel_generator.py

      - name: Generate and normalize Founder-requested Reel
        env:
          POST_ID: ${{ steps.request.outputs.post_id }}
        run: python scripts/aura3_reel_generator.py

      - name: Persist Reel job and generated MP4
        env:
          POST_ID: ${{ steps.request.outputs.post_id }}
        run: |
          git config user.name 'aura3-reel-generator'
          git config user.email 'aura3-reel-generator@users.noreply.github.com'
          git add data/reel_generation_jobs.json reels/generated 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No Reel generation changes to persist.'
          else
            git commit -m "reel(aura3): Founder generated ${POST_ID}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Close Founder generation command
        if: success() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          POST_ID: ${{ steps.request.outputs.post_id }}
        run: gh issue close "$ISSUE_NUMBER" --comment "AURA3 generated the Founder-requested Reel for ${POST_ID}. Review it in the Reels tab. No publishing action was taken."

      - name: Report generation failure
        if: failure() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --body "AURA3 could not complete this Reel generation request. No Reel was published. Inspect the Actions log for the sanitized failure reason."
