name: AURA3 Runway Alternate Key One-Shot

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

jobs:
  one-shot:
    if: >-
      github.event_name == 'issues' &&
      (github.event.issue.user.login == github.repository_owner || github.event.issue.user.login == 'optimusprime2026vol1') &&
      startsWith(github.event.issue.title, 'REEL_ALTKEY ')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUNWAYML_API_SECRET: ${{ secrets.KEI_WAN27_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'

      - name: Parse one-shot command
        id: command
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          post_id="$(printf '%s' "$ISSUE_TITLE" | awk '{print $2}')"
          if ! printf '%s' "$post_id" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo 'Invalid post id'; exit 1
          fi
          echo "post_id=$post_id" >> "$GITHUB_OUTPUT"

      - name: Verify alternate credential exists
        run: |
          python - <<'PY'
          import os
          secret=(os.getenv('RUNWAYML_API_SECRET') or '').strip()
          if not secret:
              raise SystemExit('KEI_WAN27_API_KEY unavailable')
          print('ALTERNATE_RUNWAY_CREDENTIAL_PRESENT')
          PY

      - name: Prepare one-shot Reel job
        env:
          POST_ID: ${{ steps.command.outputs.post_id }}
        run: python scripts/aura3_founder_video_generation.py prepare "$POST_ID"

      - name: Render with alternate credential
        id: render
        continue-on-error: true
        env:
          POST_ID: ${{ steps.command.outputs.post_id }}
        run: python scripts/aura3_founder_video_generation.py render "$POST_ID"

      - name: Finalize one-shot Reel
        id: finalize
        if: steps.render.outcome == 'success'
        continue-on-error: true
        env:
          POST_ID: ${{ steps.command.outputs.post_id }}
        run: python scripts/aura3_founder_video_generation.py finalize "$POST_ID"

      - name: Record failure safely
        if: steps.render.outcome != 'success' || steps.finalize.outcome == 'failure'
        env:
          POST_ID: ${{ steps.command.outputs.post_id }}
        run: python scripts/aura3_founder_video_generation.py fail "$POST_ID" --reason alternate_key_one_shot_failed

      - name: Persist one-shot result
        run: |
          git config user.name 'aura3-runway-one-shot'
          git config user.email 'aura3-runway-one-shot@users.noreply.github.com'
          git add data/video_jobs.json videos/generated 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No one-shot state change to persist.'
          else
            git commit -m "test(aura3): alternate Runway key one-shot result"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Close one-shot issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NUMBER" --comment "AURA3 alternate-key one-shot completed. No publish action was performed."

      - name: Enforce truthful conclusion
        if: steps.render.outcome != 'success' || steps.finalize.outcome == 'failure'
        run: exit 1
