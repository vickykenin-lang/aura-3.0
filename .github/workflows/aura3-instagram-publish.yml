name: AURA3 Controlled Instagram Publish

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "Approved AURA3 post ID"
        required: false
        type: string
  push:
    branches: [main, aura3-final-publish-loop]
    paths:
      - 'operations/instagram_publish_request.json'
      - '.github/workflows/aura3-instagram-publish.yml'
      - 'scripts/publish_instagram.py'

concurrency:
  group: aura3-instagram-publish
  cancel-in-progress: false

jobs:
  validate-request:
    if: github.event_name != 'workflow_dispatch' || github.actor == github.repository_owner || github.actor == 'optimusprime2026vol1'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      execute: ${{ steps.request.outputs.execute }}
      post_id: ${{ steps.request.outputs.post_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
      - name: Install image verification dependency
        run: python -m pip install 'pillow>=11.3,<13'
      - id: request
        name: Resolve and validate publish request
        env:
          DISPATCH_POST_ID: ${{ inputs.post_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path('.')
          req = json.loads((root/'operations/instagram_publish_request.json').read_text())
          post_id = (os.getenv('DISPATCH_POST_ID') or '').strip() or str(req.get('post_id','')).strip()
          execute = bool(req.get('execute'))
          if os.getenv('EVENT_NAME') == 'workflow_dispatch' and post_id:
              execute = True

          published = json.loads((root/'content/published.json').read_text())
          if not post_id:
              raise SystemExit('REFUSED: post_id missing')
          if (published.get(post_id) or {}).get('instagram', {}).get('id'):
              execute = False
          if execute:
              import subprocess, sys
              certificate = root/'certification/evidence/live-certification.json'
              certificate.parent.mkdir(parents=True, exist_ok=True)
              result = subprocess.run([sys.executable, 'scripts/certify_live.py'], capture_output=True, text=True)
              certificate.write_text(result.stdout)
              if result.returncode != 0:
                  raise SystemExit('REFUSED: current standalone certification did not pass')
              sys.path.insert(0, 'scripts')
              import release_guard
              release_guard.prepare_release(root, post_id)

          out = os.environ['GITHUB_OUTPUT']
          with open(out,'a',encoding='utf-8') as f:
              f.write(f"execute={'true' if execute else 'false'}\n")
              f.write(f"post_id={post_id}\n")
          print(json.dumps({
              'request_valid': True,
              'post_id': post_id,
              'execute': execute,
              'already_published': bool((published.get(post_id) or {}).get('instagram', {}).get('id')),
              'public_action_performed': False
          }, indent=2))
          PY

  publish:
    needs: validate-request
    if: needs.validate-request.outputs.execute == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
      - name: Install image verification dependency
        run: python -m pip install 'pillow>=11.3,<13'
      - name: Refresh current standalone certification
        run: |
          mkdir -p certification/evidence
          python scripts/certify_live.py > certification/evidence/live-certification.json
      - name: Verify Instagram credential presence
        env:
          IG_TOKEN: ${{ secrets.IG_AURA3_TOKEN || secrets.IG_AURA2_TOKEN }}
          IG_ID: ${{ secrets.IG_AURA3_ID || secrets.IG_AURA2_ID }}
        run: |
          test -n "$IG_TOKEN" || { echo 'REFUSED: Instagram token secret missing'; exit 2; }
          test -n "$IG_ID" || { echo 'REFUSED: Instagram account ID secret missing'; exit 2; }
          echo 'Instagram credential references are present; values are not printed.'
      - name: Publish approved post
        env:
          POST_ID: ${{ needs.validate-request.outputs.post_id }}
          IG_AURA2_TOKEN: ${{ secrets.IG_AURA3_TOKEN || secrets.IG_AURA2_TOKEN }}
          IG_AURA2_ID: ${{ secrets.IG_AURA3_ID || secrets.IG_AURA2_ID }}
        run: |
          python - <<'PY'
          import os, subprocess
          ref = 'refs/heads/' + os.environ['GITHUB_REF_NAME']
          result = subprocess.run(['git', 'ls-remote', 'origin', ref], check=True, capture_output=True, text=True)
          rows = result.stdout.split()
          if not rows or rows[0] != os.environ['GITHUB_SHA']:
              raise SystemExit('REFUSED: branch changed after release validation; review the current controls and content')
          PY
          python scripts/publish_instagram.py
      - name: Build publish evidence
        id: publish-evidence
        env:
          POST_ID: ${{ needs.validate-request.outputs.post_id }}
        run: |
          mkdir -p evaluation/results
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          post_id = os.environ['POST_ID']
          published = json.loads(Path('content/published.json').read_text())
          item = published.get(post_id) or {}
          ig = item.get('instagram') or {}
          if not ig.get('id'):
              raise SystemExit('published media id missing from canonical registry')
          evidence = {
              'schema_version': 1,
              'department_id': 'aura3',
              'status': 'INSTAGRAM_PUBLISH_VERIFIED_BY_API_MEDIA_ID',
              'post_id': post_id,
              'media_id': ig.get('id'),
              'permalink': ig.get('url',''),
              'published_at': ig.get('at'),
              'caption_sha256': ig.get('caption_sha256'),
              'workflow_run_id': os.getenv('GITHUB_RUN_ID'),
              'source_sha': os.getenv('GITHUB_SHA'),
              'observed_at': datetime.now(timezone.utc).isoformat(),
              'business_outcome_claim': False,
              'truth_note': 'Instagram API returned a media ID and the canonical published registry was updated. This proves publication, not engagement, enquiries, leads or revenue.'
          }
          Path('evaluation/results/aura3-instagram-publish.json').write_text(json.dumps(evidence,indent=2)+'\n')
          print(json.dumps(evidence,indent=2))
          PY
      - name: Persist canonical publication evidence
        env:
          POST_ID: ${{ needs.validate-request.outputs.post_id }}
        run: |
          git config user.name 'aura3-runtime'
          git config user.email 'aura3-runtime@users.noreply.github.com'
          git add content/published.json data/approvals.json evaluation/results/aura3-instagram-publish.json
          if git diff --cached --quiet; then
            echo 'No canonical publication changes to persist.'
          else
            git commit -m "outcome(aura3): record Instagram publication ${POST_ID}"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Dispatch independent post-publish consumers
        env:
          ACTIONS_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          ref = os.environ.get('GITHUB_REF_NAME') or 'main'
          token = os.environ['ACTIONS_TOKEN']

          def dispatch(workflow, payload):
              endpoint = f"https://api.github.com/repos/{repo}/actions/workflows/{workflow}/dispatches"
              req = urllib.request.Request(
                  endpoint,
                  data=json.dumps(payload).encode(),
                  method='POST',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                      'User-Agent': 'AURA3-PostPublish-Orchestrator/1.0',
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  if response.status != 204:
                      raise RuntimeError(f'{workflow} dispatch returned HTTP {response.status}')

          dispatch(
              'aura3-approval-queue-maintainer.yml',
              {'ref': ref, 'inputs': {'trigger_reason': 'instagram_published'}}
          )
          dispatch(
              'aura3-hf-phase10-business-outcome.yml',
              {'ref': ref}
          )
          print(json.dumps({
              'queue_refill_dispatched': True,
              'phase10_measurement_dispatched': True,
              'coupling': 'INDEPENDENT_CONSUMERS_AFTER_VERIFIED_PUBLICATION'
          }))
          PY
      - name: Upload publish evidence
        if: always() && steps.publish-evidence.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aura3-instagram-publish-evidence
          path: evaluation/results/aura3-instagram-publish.json
          if-no-files-found: warn
          retention-days: 7
