name: AURA3 Reel Generation Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/aura3_reel_generator.py'
      - 'data/reel_generation_jobs.json'
      - 'index.html'
      - 'reels.html'
      - '.github/workflows/aura3-founder-reel-generation.yml'
      - '.github/workflows/aura3-founder-reel-approval.yml'
      - '.github/workflows/aura3-video-generation-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
      - name: Compile Reel runtime
        run: python -m py_compile scripts/aura3_reel_generator.py
      - name: Validate consolidated Reel contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          jobs=json.loads(Path('data/reel_generation_jobs.json').read_text())
          wf=Path('.github/workflows/aura3-founder-reel-generation.yml').read_text()
          approval=Path('.github/workflows/aura3-founder-reel-approval.yml').read_text()
          index=Path('index.html').read_text()
          reels=Path('reels.html').read_text()
          runtime=Path('scripts/aura3_reel_generator.py').read_text()
          assert jobs['schema_version']==1 and isinstance(jobs['jobs'],list)
          assert "startsWith(github.event.issue.title, 'REEL_GENERATE ')" in wf
          assert 'RUNWAYML_API_SECRET' in wf
          assert '/image_to_video' in runtime and 'ffmpeg' in runtime
          assert 'INTERIOR_REFERENCE_FIDELITY_WALKTHROUGH_V1' in runtime
          assert 'READY_FOR_FOUNDER_REVIEW' in runtime
          assert 'Generate Reel' in index and 'REEL_GENERATE' in index
          assert 'href="reels.html"' in index and 'videos.html' not in index
          assert 'reel_generation_jobs.json' in index and 'reel_generation_jobs.json' in reels
          assert 'READY_FOR_FOUNDER_REVIEW' in approval
          assert 'PUBLISH OFF' in reels
          print('AURA3_REEL_GENERATION_CONTRACT_PASS')
          PY
      - name: Check dashboard JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          for name in ('index.html','reels.html'):
              text=Path(name).read_text()
              scripts=re.findall(r'<script>(.*?)</script>',text,re.S)
              if len(scripts)!=1: raise SystemExit(f'{name}: expected one inline script')
              Path('/tmp/'+name+'.js').write_text(scripts[0])
          PY
          node --check /tmp/index.html.js
          node --check /tmp/reels.html.js
