name: AURA3 Capability Qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    env:
      AI_PROVIDER_1_SECRET: ${{ secrets.AI_PROVIDER_1_SECRET }}
      AI_PROVIDER_2_SECRET: ${{ secrets.AI_PROVIDER_2_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run fail-closed capability probes
        run: python scripts/qualify_capabilities.py
      - name: Upload capability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura3-capability-qualification-evidence
          path: certification/evidence/capability-qualification.json
