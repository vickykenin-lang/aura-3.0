name: AURA2 Daily Content Generator

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aura2-repo-write
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Generate ten daily candidates
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python3 scripts/generate_candidates.py

      - name: Commit daily batch
        run: |
          git config user.name "aura2-runner"
          git config user.email "aura2-runner@users.noreply.github.com"
          git add -- content/calendar.json data/approvals.json
          git diff --staged --quiet || git commit -m "content: generate daily AURA2 candidates"
          git push
