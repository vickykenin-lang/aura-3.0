<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070d">
<title>AURA3 — Reels</title>
<style>
:root{--bg:#05070d;--panel:#0d121c;--line:#253044;--text:#f8fafc;--muted:#94a3b8;--green:#22c55e;--red:#ef4444;--amber:#f59e0b;--cyan:#22d3ee}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#10243a 0,#05070d 42%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}.wrap{max-width:1180px;margin:auto;padding:22px 16px 70px}.top,.system,.idrow{display:flex;align-items:center;justify-content:space-between;gap:12px}.top{margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.orb{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#8ff5ff,#22d3ee 35%,#0369a1 72%);box-shadow:0 0 35px #22d3ee55}.brand h1{font-size:20px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:3px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.btn,.linkbtn{border:1px solid var(--line);background:#111827;color:var(--text);border-radius:10px;padding:9px 12px;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none}.system,.card{background:linear-gradient(180deg,#111827,#0a0f18);border:1px solid var(--line);border-radius:14px}.system{padding:12px 14px;margin-bottom:16px}.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 12px #22c55e80}.sysleft{display:flex;align-items:center;gap:9px}.title{font-size:12px;font-weight:800}.desc{font-size:11px;color:var(--muted);margin-top:2px}.chip{font-size:10px;font-weight:800;border-radius:999px;padding:5px 8px;border:1px solid var(--line)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}.card{overflow:hidden}.video{background:#020617}.video video{width:100%;aspect-ratio:9/16;max-height:560px;display:block;background:#020617}.body{padding:12px}.pid{font:700 11px ui-monospace,SFMono-Regular,monospace;color:#cbd5e1}.state{font-size:10px;font-weight:800;color:#fbbf24}.hook{font-size:15px;font-weight:800;line-height:1.35;margin:9px 0}.meta,.line{font-size:11px;color:#cbd5e1;line-height:1.5}.checks{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.check{font-size:9px;padding:4px 6px;border-radius:6px;background:#064e3b33;color:#86efac;border:1px solid #16653466}.check.cyan{background:#08334455;color:#67e8f9;border-color:#155e7566}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.approve,.reject{border-radius:10px;padding:10px;border:0;font-weight:800;cursor:pointer}.approve{background:linear-gradient(135deg,#16a34a,#22c55e);color:white}.reject{background:#3f0d13;color:#fca5a5;border:1px solid #7f1d1d}.done{border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;color:#86efac;font-size:11px}.pending{padding:24px;color:#fbbf24;text-align:center}.foot{font-size:10px;color:#64748b;text-align:center;margin-top:26px}@media(max-width:720px){.top,.system{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap">
<div class="top"><div class="brand"><div class="orb"></div><div><h1>AURA3 Reels</h1><div class="sub">Founder-triggered generated Reels + existing certified Reel previews · one review center</div></div></div><div class="toolbar"><button class="btn" onclick="loadAll()">↻ Refresh</button><a class="linkbtn" href="index.html">Static Posts</a><a class="linkbtn" href="https://github.com/vickykenin-lang/aura-3.0/actions" target="_blank" rel="noopener">Actions</a></div></div>
<div class="system"><div class="sysleft"><div class="dot"></div><div><div class="title">AURA3 REELS</div><div class="desc" id="systemDesc">Loading Reel jobs and previews…</div></div></div><span class="chip">PUBLISH OFF</span></div>
<div class="grid" id="grid"><div class="card"><div class="body">Loading…</div></div></div>
<div class="foot">Founder Reel approval does not publish automatically. Instagram Reel publishing remains separately governed.</div>
</div>
<script>
const REPO='vickykenin-lang/aura-3.0',$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function json(path){try{const r=await fetch(path+'?v='+Date.now(),{cache:'no-store'});return r.ok?await r.json():null}catch{return null}}
function cmd(action,id){const verb=action==='APPROVE'?'REEL_APPROVE':'REEL_REJECT';const title=`${verb} ${id}`;const body=`AURA3 Founder Reel command\n\nReel: ${id}\nAction: ${action}\n\nAURA3 will revalidate technical eligibility before recording this decision. Approval does not publish.`;window.open(`https://github.com/${REPO}/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`,'_blank','noopener')}
function decision(approvals,published,id){const state=String(approvals?.[id]||'pending').toLowerCase(),ispub=!!published?.[id];return{state,ispub,done:state!=='pending'}}
function controls(d,id){return d.done?`<div class="done">${d.ispub?'Published':'Founder decision recorded: '+esc(d.state)}</div>`:`<div class="actions"><button class="approve" onclick="cmd('APPROVE','${esc(id)}')">✓ Approve</button><button class="reject" onclick="cmd('REJECT','${esc(id)}')">✕ Reject</button></div>`}
async function loadAll(){const [jobsData,cal,ap,pub,phase,manifest]=await Promise.all([json('data/reel_generation_jobs.json'),json('data/reels_calendar.json'),json('data/reels_approvals.json'),json('data/reels_published.json'),json('evaluation/AURA3_REELS_PHASE2_TEST_STATUS.json'),json('reels/previews/manifest.json')]);const approvals=ap||{},published=pub||{},cards=[];const jobs=(jobsData?.jobs||[]).slice().reverse();for(const j of jobs){const d=decision(approvals,published,j.reel_id),ready=j.status==='READY_FOR_FOUNDER_REVIEW'&&j.technical_pass===true;if(!ready){cards.push(`<article class="card"><div class="pending"><div class="pid">${esc(j.reel_id)}</div><div style="margin-top:8px">${esc(j.status||'UNKNOWN')}</div><div class="meta">Source post: ${esc(j.post_id)}</div></div></article>`);continue}const t=j.technical||{};cards.push(`<article class="card"><div class="video"><video controls playsinline preload="metadata" poster="${esc(j.source_image)}"><source src="${esc(j.video_path)}" type="video/mp4">Your browser cannot play this Reel.</video></div><div class="body"><div class="idrow"><span class="pid">${esc(j.reel_id)}</span><span class="state">● ${d.ispub?'PUBLISHED':d.state.toUpperCase()}</span></div><div class="hook">Founder-generated interior walkthrough</div><div class="meta">Source post: ${esc(j.post_id)} · ${esc(j.prompt_profile||'')}</div><div class="checks"><span class="check">${esc(t.duration_seconds||8)} sec ✓</span><span class="check">${esc(t.width||1080)}×${esc(t.height||1920)} ✓</span><span class="check">24fps target ✓</span><span class="check cyan">Runway I2V</span></div>${controls(d,j.reel_id)}</div></article>`)}const reels=cal?.reels||[],evidence=phase?.reels||[],certified=new Set(evidence.filter(x=>x.technical_status==='TECHNICAL_PASS').map(x=>x.reel_id));for(const r of reels.filter(x=>certified.has(x.id))){const d=decision(approvals,published,r.id);cards.push(`<article class="card"><div class="video"><video controls playsinline preload="metadata" poster="${esc(r.image)}"><source src="reels/previews/${esc(r.id)}.mp4" type="video/mp4">Your browser cannot play this Reel preview.</video></div><div class="body"><div class="idrow"><span class="pid">${esc(r.id)}</span><span class="state">● ${d.ispub?'PUBLISHED':d.state.toUpperCase()}</span></div><div class="hook">${esc(r.hook)}</div><div class="meta">Existing certified Reel preview · ${esc(r.disclosure||'Inspiration reference')}</div><div class="checks"><span class="check">Certified preview ✓</span><span class="check cyan">Legacy Reel flow</span></div>${controls(d,r.id)}</div></article>`)}$('systemDesc').textContent=`${jobs.length} Founder generation job(s) · ${reels.filter(x=>certified.has(x.id)).length} existing certified Reel(s) · consolidated review center.`;$('grid').innerHTML=cards.join('')||'<div class="card"><div class="body">No Reel is currently available.</div></div>'}
loadAll();setInterval(loadAll,30000);
</script></body></html>
