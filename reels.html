<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070d">
<title>AURA3 — Reel Approval Center</title>
<style>
:root{--bg:#05070d;--panel:#0d121c;--line:#253044;--text:#f8fafc;--muted:#94a3b8;--green:#22c55e;--red:#ef4444;--amber:#f59e0b;--cyan:#22d3ee}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#10243a 0,#05070d 42%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}.wrap{max-width:1180px;margin:auto;padding:22px 16px 70px}.top,.system,.idrow{display:flex;align-items:center;justify-content:space-between;gap:12px}.top{margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.orb{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#8ff5ff,#22d3ee 35%,#0369a1 72%);box-shadow:0 0 35px #22d3ee55}.brand h1{font-size:20px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:3px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.btn,.linkbtn{border:1px solid var(--line);background:#111827;color:var(--text);border-radius:10px;padding:9px 12px;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none}.system,.card{background:linear-gradient(180deg,#111827,#0a0f18);border:1px solid var(--line);border-radius:14px}.system{padding:12px 14px;margin-bottom:16px}.dot{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 12px #f59e0b80}.sysleft{display:flex;align-items:center;gap:9px}.title{font-size:12px;font-weight:800}.desc{font-size:11px;color:var(--muted);margin-top:2px}.chip{font-size:10px;font-weight:800;border-radius:999px;padding:5px 8px;border:1px solid var(--line)}.chip.fail{color:#fca5a5;border-color:#7f1d1d}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}.card{overflow:hidden}.video{background:#020617}.video video{width:100%;aspect-ratio:9/16;max-height:560px;display:block;background:#020617}.body{padding:12px}.pid{font:700 11px ui-monospace,SFMono-Regular,monospace;color:#cbd5e1}.state{font-size:10px;font-weight:800;color:#f87171}.hook{font-size:15px;font-weight:800;line-height:1.35;margin:9px 0}.meta,.line{font-size:11px;color:#cbd5e1;line-height:1.5}.checks{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.check{font-size:9px;padding:4px 6px;border-radius:6px;background:#064e3b33;color:#86efac;border:1px solid #16653466}.check.music{background:#08334455;color:#67e8f9;border-color:#155e7566}.failed{border:1px solid #7f1d1d;background:#3f0d1333;border-radius:10px;padding:10px;text-align:center;color:#fca5a5;font-size:11px;font-weight:800}.foot{font-size:10px;color:#64748b;text-align:center;margin-top:26px}@media(max-width:720px){.top,.system{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap">
<div class="top"><div class="brand"><div class="orb"></div><div><h1>AURA3 Reel Approval Center</h1><div class="sub">5–10 sec home-interior Reels · Founder creative-quality gate</div></div></div><div class="toolbar"><button class="btn" onclick="loadAll()">↻ Refresh</button><a class="linkbtn" href="index.html">Static Posts</a><a class="linkbtn" href="https://github.com/vickykenin-lang/aura-3.0/actions" target="_blank" rel="noopener">Actions</a></div></div>
<div class="system"><div class="sysleft"><div class="dot"></div><div><div class="title">AURA3 REELS · QUALITY RECOVERY</div><div class="desc" id="systemDesc">Loading creative-quality state…</div></div></div><span class="chip fail">PUBLISH OFF</span></div>
<div class="grid" id="grid"><div class="card"><div class="body">Loading…</div></div></div>
<div class="foot">Disclosure: <b>Inspiration reference</b> · Failed-quality previews cannot be approved or published.</div>
</div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function json(path){try{const r=await fetch(path+'?v='+Date.now(),{cache:'no-store'});return r.ok?await r.json():null}catch{return null}}
async function loadAll(){const [cal,phase,manifest,quality]=await Promise.all([json('data/reels_calendar.json'),json('evaluation/AURA3_REELS_PHASE2_TEST_STATUS.json'),json('reels/previews/manifest.json'),json('evaluation/AURA3_REELS_CREATIVE_QUALITY_STATUS.json')]);const reels=cal?.reels||[],evidence=phase?.reels||[];const certified=new Set(evidence.filter(x=>x.technical_status==='TECHNICAL_PASS').map(x=>x.reel_id));const failed=new Set(quality?.affected_reels||[]);const blocked=quality?.founder_quality_gate==='FAIL';$('systemDesc').textContent=blocked?'Founder creative-quality gate FAILED. Old technical-pass Reels are withdrawn; AURA3 v2 replacements are being developed.':'Waiting for Founder creative-quality assessment.';$('grid').innerHTML=reels.filter(x=>certified.has(x.id)).map(r=>{const isFailed=blocked&&failed.has(r.id),music=phase?.music?.title||'previous preview audio';return `<article class="card"><div class="video"><video controls playsinline preload="metadata" poster="${esc(r.image)}"><source src="reels/previews/${esc(r.id)}.mp4" type="video/mp4">Your browser cannot play this Reel preview.</video></div><div class="body"><div class="idrow"><span class="pid">${esc(r.id)}</span><span class="state">● ${isFailed?'QUALITY FAILED':'REVIEW'}</span></div><div class="hook">${esc(r.hook)}</div><div class="line">${(r.overlay_lines||[]).map(esc).join(' · ')}</div><div class="meta">${esc(r.cta)} · ${esc(r.disclosure)}</div><div class="checks"><span class="check">Technical format ✓</span><span class="check music">Previous audio: ${esc(music)}</span></div>${isFailed?'<div class="failed">Founder quality failed — withdrawn from approval and publishing</div>':'<div class="failed">Awaiting quality decision</div>'}</div></article>`}).join('')||'<div class="card"><div class="body">No Reel preview available.</div></div>'}
loadAll();setInterval(loadAll,30000);
</script></body></html>
