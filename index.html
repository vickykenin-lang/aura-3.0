<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURA2 Dashboard</title>
<style>
:root{--bg:#0f1115;--s:#171a21;--l:#2a2f3a;--ink:#e8eaed;--m:#9aa0a6;--a:#e8963e;--g:#4ade80;--r:#f87171}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding:16px}
.w{max-width:640px;margin:0 auto}
h1{font-size:18px} .sub{color:var(--m);font-size:12px;margin:4px 0 16px}
.card{background:var(--s);border:1px solid var(--l);border-radius:14px;padding:14px;margin-bottom:12px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
.g{background:#14351f;color:var(--g)} .r{background:#3a1414;color:var(--r)} .a{background:#332708;color:#fbbf24}
.appr{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--l)}
.appr:last-child{border:0}
.btn{display:inline-block;margin-right:6px;padding:6px 10px;border-radius:8px;font-size:13px;font-weight:700;text-decoration:none}
.ok{background:#14351f;color:var(--g)} .no{background:#3a1414;color:var(--r)}
.empty{color:var(--m);text-align:center;padding:16px}
</style></head>
<body>
<div class="w">
  <h1>AURA2 · Design Infra</h1>
  <p class="sub">Traffic-first · only approved or score ≥ 7</p>
  <div class="card"><span class="pill r" id="pill">RED</span>
    <p id="note" style="margin-top:8px;font-size:14px"></p></div>
  <div class="card"><b>आपकी मंज़ूरी</b>
    <p class="sub">Pre-approvers already filtered junk. You only see ≥7.</p>
    <div id="box" class="empty">Loading…</div></div>
  <div class="card"><a href="leads.html" style="color:#e8963e">Open lead form</a></div>
</div>
<script>
const REPO='vickykenin-lang/design-infra-aura2';
function eligible(date,ap,biz){
  if(ap[date]==='rejected') return false;
  if(ap[date]==='approved') return true;
  const s=biz[date] && biz[date].score;
  return typeof s==='number' && s>=7;
}
async function load(){
  const t='?t='+Date.now();
  let status={}, cal={days:[]}, ap={}, biz={};
  try{status=await (await fetch('data/status.json'+t)).json()}catch(e){}
  try{cal=await (await fetch('content/calendar.json'+t)).json()}catch(e){}
  try{ap=await (await fetch('data/approvals.json'+t)).json()}catch(e){}
  try{biz=await (await fetch('data/business_report.json'+t)).json()}catch(e){}
  document.getElementById('pill').className='pill '+(status.overall==='green'?'g':'r');
  document.getElementById('pill').textContent=(status.overall||'red').toUpperCase();
  document.getElementById('note').textContent=status.overall_note_hi||status.overall_note_en||'';
  const days=(cal.days||[]).filter(d=>eligible(d.date,ap,biz));
  const box=document.getElementById('box');
  if(!days.length){box.innerHTML='<div class="empty">कोई ≥7 / मंज़ूर कार्ड नहीं. नामंज़ूर छुपे हैं.</div>';return;}
  box.innerHTML=days.map(d=>{
    const st=ap[d.date];
    const score=biz[d.date]&&biz[d.date].score;
    const chip=st==='approved'?'<span class="pill g">Approved</span>':'<span class="pill a">Awaiting you</span>';
    const btns=st==='approved'?'':'<a class="btn ok" target="_blank" href="https://github.com/'+REPO+'/issues/new?title='+encodeURIComponent('APPROVE '+d.date)+'">✅</a><a class="btn no" target="_blank" href="https://github.com/'+REPO+'/issues/new?title='+encodeURIComponent('REJECT '+d.date)+'">❌</a>';
    return '<div class="appr"><div><div style="font-size:12px;color:#9aa0a6">'+d.date+(score!=null?' · '+score+'/10':'')+'</div><div style="font-weight:700">'+(d.ig&&d.ig.hook_en||'')+'</div>'+chip+' <span style="margin-left:8px">'+btns+'</span></div></div>';
  }).join('');
}
load();
</script>
</body></html>
