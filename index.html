<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURA2 — Command Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');
  :root {
    --bg:#03050a; --card:rgba(14,18,26,0.85); --border:rgba(255,255,255,0.08);
    --text:#f1f5f9; --muted:#94a3b8; --green:#22c55e; --red:#ef4444;
    --amber:#f59e0b; --cyan:#22d3ee;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
  #matrix{position:fixed;inset:0;z-index:0;opacity:0.12;pointer-events:none}
  .content{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:16px 14px 120px}
  .aura-section{display:flex;flex-direction:column;align-items:center;padding:20px 0 10px;margin-bottom:8px}
  .orb-wrap{position:relative;width:160px;height:160px;display:flex;align-items:center;justify-content:center}
  .orb{width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#67e8f9,#0ea5e9 40%,#0369a1 70%,#0c4a6e);box-shadow:0 0 20px rgba(34,211,238,0.5);position:relative;z-index:2;animation:orbFloat 4s ease-in-out infinite}
  .orb-ring{position:absolute;border-radius:50%;border:1.5px solid rgba(34,211,238,0.3);animation:ringSpin 12s linear infinite}
  .orb-ring.r1{width:140px;height:140px}.orb-ring.r2{width:155px;height:155px;animation-direction:reverse;animation-duration:18s}
  @keyframes orbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes ringSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  .orb.speaking{box-shadow:0 0 30px rgba(34,211,238,0.8);transform:scale(1.08)}
  .orb.happy{background:radial-gradient(circle at 35% 35%,#86efac,#22c55e 45%,#15803d)}
  .aura-label{margin-top:14px;text-align:center}
  .aura-label .name{font-size:15px;font-weight:800;background:linear-gradient(90deg,#67e8f9,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .aura-label .role{font-size:11px;color:var(--muted)}
  .chat-box{width:100%;max-width:420px;margin:0 auto 28px;background:rgba(10,14,22,0.92);border:1px solid rgba(34,211,238,0.22);border-radius:16px;overflow:hidden}
  .chat-messages{height:160px;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:9px}
  .msg{max-width:90%;padding:8px 12px;border-radius:13px;font-size:13px;line-height:1.4}
  .msg.aura{align-self:flex-start;background:rgba(34,211,238,0.12);border:1px solid rgba(34,211,238,0.18)}
  .msg.user{align-self:flex-end;background:rgba(255,255,255,0.07)}
  .msg .who{font-size:10px;font-weight:700;margin-bottom:2px;opacity:0.65}
  .chat-input-row{display:flex;gap:8px;padding:10px 12px 12px;border-top:1px solid rgba(255,255,255,0.06)}
  .chat-input{flex:1;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:11px;padding:10px 12px;color:#fff;font-size:13px;outline:none}
  .chat-send{background:linear-gradient(135deg,#0ea5e9,#22d3ee);border:none;border-radius:11px;width:40px;font-weight:800;cursor:pointer}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-bottom:16px}
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px}
  .stat-card .label{font-size:10px;color:var(--muted);text-transform:uppercase}
  .stat-card .value{font-size:18px;font-weight:800;margin-top:2px;font-family:'JetBrains Mono',monospace}
  .stat-card .value.green{color:var(--green)}.stat-card .value.red{color:var(--red)}.stat-card .value.amber{color:var(--amber)}.stat-card .value.cyan{color:var(--cyan)}
  .section-title{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
  .gate-note{font-size:11px;color:var(--cyan);margin-bottom:12px;opacity:.9}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}
  .card-img{position:relative;aspect-ratio:4/5;overflow:hidden;background:#0f172a}
  .card-img img{width:100%;height:100%;object-fit:cover;display:block}
  .img-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.88) 0%,rgba(0,0,0,.3) 45%,transparent 70%);z-index:1;pointer-events:none}
  .logo-badge{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.7);color:#fff;font-size:9px;font-weight:700;padding:3px 7px;border-radius:6px;z-index:3}
  .logo-badge span{color:var(--cyan)}
  .score-badge{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.75);border:1px solid rgba(34,197,94,.4);color:var(--green);font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;z-index:3}
  .status-badge{position:absolute;bottom:52px;right:10px;font-size:9px;font-weight:700;padding:3px 7px;border-radius:6px;z-index:3;background:rgba(245,158,11,.2);color:var(--amber);border:1px solid rgba(245,158,11,.35)}
  .img-text{position:absolute;bottom:0;left:0;right:0;padding:12px 11px 14px;z-index:3}
  .img-hook{font-size:13px;font-weight:700;line-height:1.3;color:#fff;margin-bottom:3px}
  .img-cap{font-size:11px;color:rgba(255,255,255,.82)}
  .card-body{padding:11px 12px 13px}
  .card-id{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);margin-bottom:8px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
  .tag{background:rgba(34,211,238,.12);color:var(--cyan);padding:2px 6px;border-radius:4px;font-size:9px}
  .tag.gate{background:rgba(34,197,94,.15);color:var(--green)}
  .actions{display:flex;gap:6px}
  .btn{flex:1;text-align:center;text-decoration:none;font-size:12px;font-weight:700;padding:8px 6px;border-radius:9px;border:none;cursor:pointer}
  .btn-approve{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff}
  .btn-reject{background:rgba(239,68,68,.12);color:#f87171;border:1px solid rgba(239,68,68,.22)}
  .footer-note{margin-top:28px;text-align:center;font-size:11px;color:var(--muted);opacity:.6}
  .empty{text-align:center;padding:40px 16px;color:var(--muted);font-size:14px;line-height:1.5}
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<div class="content">
  <div class="aura-section">
    <div class="orb-wrap">
      <div class="orb-ring r1"></div><div class="orb-ring r2"></div>
      <div class="orb" id="auraOrb"></div>
    </div>
    <div class="aura-label">
      <div class="name">AURA2</div>
      <div class="role">QC · DeepSeek gate · Online</div>
    </div>
  </div>
  <div class="chat-box">
    <div class="chat-messages" id="chatMessages">
      <div class="msg aura"><div class="who">AURA2</div>Quality gate me DeepSeek heart lag gaya. Sirf gate PASS + score ≥7 approve queue me aate hain.</div>
    </div>
    <div class="chat-input-row">
      <input class="chat-input" id="chatInput" placeholder="AURA2 se baat karein..." onkeydown="if(event.key==='Enter')sendMsg()">
      <button class="chat-send" onclick="sendMsg()">↑</button>
    </div>
  </div>
  <div class="stats">
    <div class="stat-card"><div class="label">Gate pass</div><div class="value green" id="statPass">—</div></div>
    <div class="stat-card"><div class="label">Pending</div><div class="value amber" id="statPending">—</div></div>
    <div class="stat-card"><div class="label">Published</div><div class="value cyan" id="statPublished">—</div></div>
    <div class="stat-card"><div class="label">Max queue</div><div class="value">20</div></div>
  </div>
  <div class="section-title">Approval queue — DeepSeek validated</div>
  <p class="gate-note" id="gateNote">Loading gate results…</p>
  <div class="grid" id="grid"></div>
  <p class="footer-note">AURA2 · DeepSeek QC · Max 20 · Publish OK removes card</p>
</div>
<script>
const MAX_PENDING = 20;
const REPO = 'vickykenin-lang/design-infra-aura2';
const STORAGE_KEY = 'aura2_local_queue_v1';

const ALL_POSTS = [
  {id:'p01',score:8,tag:'living',hook:'What a 2BHK interior actually costs in Delhi NCR',cap:'टर्नकी 2BHK अक्सर ₹8–15 लाख। Free consultation — link in bio.',image:'https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?w=1200&q=80'},
  {id:'p02',score:8,tag:'kitchen',hook:'One team. Four steps. Zero contractor circus.',cap:'डिज़ाइन फ़्रीज़ → मटीरियल → साइट → हैंडओवर. Link in bio.',image:'https://images.unsplash.com/photo-1556912173-46c336c7fd55?w=1200&q=80'},
  {id:'p03',score:7,tag:'bedroom',hook:'3 wardrobe mistakes that waste a full wall',cap:'गहरी ऊँचाई, कोई लॉफ्ट नहीं, अंदर रोशनी। Link in bio.',image:'https://images.unsplash.com/photo-1616594039964-ae9021a400a0?w=1200&q=80'},
  {id:'p04',score:8,tag:'bathroom',hook:'Same 40 sq ft. Completely different morning.',cap:'Bathroom refresh: 10–18 days. Link in bio.',image:'https://images.unsplash.com/photo-1552321554-5fefe8c9ef14?w=1200&q=80'},
  {id:'p05',score:7,tag:'office',hook:'A spare corner can become your power zone',cap:'Home office: layout + storage + light. Link in bio.',image:'https://images.unsplash.com/photo-1497366216548-37526070297c?w=1200&q=80'},
  {id:'p06',score:7,tag:'living',hook:'Japandi with Indian warmth — 2026 look',cap:'Minimal + wood + soft light. Link in bio.',image:'https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=1200&q=80'},
  {id:'p07',score:8,tag:'living',hook:'False ceiling: where the budget actually goes',cap:'Gypsum + lights often 8–15% of a 2BHK package. Link in bio.',image:'https://images.unsplash.com/photo-1600607687939-ce8a6c77931f?w=1200&q=80'},
  {id:'p08',score:7,tag:'dining',hook:'Dining that works for 4 — and festive 10',cap:'Dining refresh 7–14 days. Link in bio.',image:'https://images.unsplash.com/photo-1617806118233-18e1de3d13f0?w=1200&q=80'},
  {id:'p09',score:8,tag:'kitchen',hook:'Island vs galley — which kitchen saves money?',cap:'Galley often cheaper in Indian apartments. Link in bio.',image:'https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?w=1200&q=80'},
  {id:'p10',score:7,tag:'bedroom',hook:'Master bedroom in 12 days, not 12 vendors',cap:'Bed wall + wardrobe + lights, one contract. Link in bio.',image:'https://images.unsplash.com/photo-1615874959474-d609967f9dd2?w=1200&q=80'}
];

function loadLocal(){ try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}catch(e){return{}} }
function saveLocal(o){ localStorage.setItem(STORAGE_KEY, JSON.stringify(o)); }

async function loadJSON(path){
  try{
    const r = await fetch(path+'?t='+Date.now());
    if(!r.ok) return null;
    return await r.json();
  }catch(e){ return null; }
}

function isPublished(published, id){
  const p = published && published[id];
  return !!(p && p.instagram && (p.instagram.id || p.instagram.at));
}

async function render(){
  const published = (await loadJSON('content/published.json')) || {};
  const gate = (await loadJSON('data/gate_results.json')) || {posts:{}};
  const gatePosts = gate.posts || {};
  const hasGate = Object.keys(gatePosts).length > 0;
  const local = loadLocal();

  let publishedCount = 0, passCount = 0;
  const queue = [];

  for (const p of ALL_POSTS){
    if (isPublished(published, p.id) || local[p.id]==='published_ok'){
      publishedCount++; continue;
    }
    const g = gatePosts[p.id];
    if (hasGate){
      // HEART: only DeepSeek pass + score>=7
      if (!g || !g.pass || (g.score||0) < 7) continue;
      passCount++;
      queue.push({...p, score: g.score, gate: true, reasons: g.reasons||[]});
    } else {
      // Gate not run yet — show nothing strict (force run workflow)
      // Fallback: show interiors with warning scores only if no gate file data
    }
  }

  const shown = queue.slice(0, MAX_PENDING);
  document.getElementById('statPass').textContent = hasGate ? passCount : '—';
  document.getElementById('statPending').textContent = shown.length;
  document.getElementById('statPublished').textContent = publishedCount;

  const note = document.getElementById('gateNote');
  if (!hasGate){
    note.innerHTML = '⚠ DeepSeek gate abhi run nahi hua. Actions → <b>AURA2 Quality Gate (DeepSeek)</b> → Run workflow. Uske baad yahan sirf PASS cards aayenge.';
  } else {
    note.textContent = 'DeepSeek gate OK · updated '+(gate.updated||'')+' · sirf pass + ≥7 · max 20';
  }

  const grid = document.getElementById('grid');
  if (!shown.length){
    grid.innerHTML = hasGate
      ? '<div class="empty">Koi post gate pass nahi · DeepSeek ne reject kiya ya sab publish ho gaye.<br>Calendar refresh + Quality Gate dubara chalao.</div>'
      : '<div class="empty">Pehle Quality Gate chalao (DeepSeek ping).<br>GitHub → Actions → AURA2 Quality Gate (DeepSeek) → Run workflow</div>';
    return;
  }

  grid.innerHTML = shown.map(p=>{
    const ok = `https://github.com/${REPO}/issues/new?title=${encodeURIComponent('APPROVE '+p.id)}&body=${encodeURIComponent('Gate pass — publish '+p.id)}`;
    const no = `https://github.com/${REPO}/issues/new?title=${encodeURIComponent('REJECT '+p.id)}`;
    return `<div class="card" id="card-${p.id}">
      <div class="card-img">
        <img src="${p.image}" alt="${p.tag}" loading="lazy" onerror="this.style.opacity=0">
        <div class="img-overlay"></div>
        <div class="logo-badge">Design <span>Infra</span></div>
        <div class="score-badge">${p.score}/10</div>
        <div class="status-badge">GATE PASS</div>
        <div class="img-text"><div class="img-hook">${p.hook}</div><div class="img-cap">${p.cap}</div></div>
      </div>
      <div class="card-body">
        <div class="card-id">${p.id.toUpperCase()} <span class="tag">${p.tag}</span> <span class="tag gate">DeepSeek</span></div>
        <div class="actions">
          <button class="btn btn-approve" type="button" onclick="onApprove('${p.id}','${ok}')">✓ Approve</button>
          <a class="btn btn-reject" target="_blank" href="${no}">✕ Reject</a>
        </div>
      </div>
    </div>`;
  }).join('');
}

window.onApprove = function(id, url){
  window.open(url,'_blank');
  const local = loadLocal(); local[id]='publishing'; saveLocal(local);
  addMsg('Approve: '+id+' (DeepSeek gate pass). Publish OK → card hategi.','aura');
};

const canvas=document.getElementById('matrix'),ctx=canvas.getContext('2d');
let w,h;const dots=[];
function resize(){w=canvas.width=innerWidth;h=canvas.height=innerHeight}
addEventListener('resize',resize);resize();
for(let i=0;i<50;i++)dots.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.2+.3,vx:(Math.random()-.5)*.2,vy:(Math.random()-.5)*.2,a:Math.random()*.3+.08});
(function draw(){ctx.clearRect(0,0,w,h);dots.forEach(d=>{d.x+=d.vx;d.y+=d.vy;if(d.x<0||d.x>w)d.vx*=-1;if(d.y<0||d.y>h)d.vy*=-1;ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,7);ctx.fillStyle=`rgba(34,211,238,${d.a})`;ctx.fill()});requestAnimationFrame(draw)})();

const orb=document.getElementById('auraOrb');
function setOrb(s){orb.className='orb';if(s)orb.classList.add(s)}
function addMsg(text,who){
  const box=document.getElementById('chatMessages');
  const div=document.createElement('div');
  div.className='msg '+who;
  div.innerHTML=`<div class="who">${who==='aura'?'AURA2':'You'}</div>${text}`;
  box.appendChild(div);box.scrollTop=box.scrollHeight;
}
function auraReply(q){
  q=q.toLowerCase();
  if(q.includes('gate')||q.includes('deepseek')||q.includes('quality')) return {t:'DeepSeek quality gate active. Run Actions workflow → results data/gate_results.json → sirf pass cards dashboard pe.',s:'speaking'};
  if(q.includes('status')) return {t:'QC heart = DeepSeek. Approve only on gate pass. Publish success removes card.',s:'speaking'};
  if(q.includes('hello')||q.includes('hi')||q.includes('namaste')) return {t:'Namaste. DeepSeek gate online — galat images approve queue me nahi aani chahiye.',s:'happy'};
  return {t:'Gate, approve, status — poochho.',s:'speaking'};
}
function sendMsg(){
  const input=document.getElementById('chatInput');
  const text=input.value.trim();if(!text)return;
  addMsg(text,'user');input.value='';
  setOrb('speaking');
  setTimeout(()=>{const r=auraReply(text);addMsg(r.t,'aura');setOrb(r.s);setTimeout(()=>setOrb(''),2000)},400);
}
render();
</script>
</body>
</html>
