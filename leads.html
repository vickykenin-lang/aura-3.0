<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design Infra — Free Consultation</title>
<style>
:root{--bg:#faf7f2;--surface:#fff;--ink:#1f2937;--ink-2:#6b7280;--line:#e8e2d8;--accent:#b45309;--radius:16px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
.wrap{max-width:520px;margin:0 auto;padding:20px}
.hero{border-radius:var(--radius);padding:22px;color:#fff;background:linear-gradient(135deg,#1c1917,#78350f);margin-bottom:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px}
label{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin:12px 0 5px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:15px;font-family:inherit}
.btn{display:block;width:100%;border:0;background:var(--accent);color:#fff;border-radius:12px;padding:14px;font-weight:700;margin-top:16px;text-align:center;text-decoration:none}
.btn.secondary{background:#fff;color:var(--accent);border:1.5px solid var(--accent)}
.note{font-size:12px;color:var(--ink-2);margin-top:10px;text-align:center}
#resultBox{display:none}#resultBox.show{display:block}#formBox.hide{display:none}
</style></head>
<body>
<div class="wrap">
  <div class="hero">
    <div style="opacity:.8;font-size:12px">DESIGN INFRA</div>
    <h1>मुफ़्त सलाह पाइए</h1>
    <p style="opacity:.9;margin-top:8px;font-size:14px">Turnkey home &amp; office interiors — one team, one contract.</p>
  </div>
  <div class="card" id="formBox">
    <label>आपका नाम *</label><input id="f_name" required>
    <label>फ़ोन *</label><input id="f_phone" type="tel" placeholder="+91" required>
    <label>शहर *</label>
    <select id="f_city"><option>Delhi NCR</option><option>Mumbai</option><option>Bengaluru</option><option>Hyderabad</option><option>Pune</option><option>Other</option></select>
    <label>आप क्या ढूँढ रहे हैं?</label>
    <select id="f_project">
      <option>Full home interior (turnkey)</option>
      <option>Office / commercial</option>
      <option>Full renovation</option>
      <option>One room / kitchen / wardrobe</option>
    </select>
    <label>बजट (वैकल्पिक)</label>
    <select id="f_budget">
      <option value="">Prefer not to say</option>
      <option value="500000">Under ₹8 lakh</option>
      <option value="1000000">₹8–15 lakh</option>
      <option value="2000000">₹15–25 lakh</option>
      <option value="3000000">₹25 lakh+</option>
    </select>
    <label>और कुछ</label><textarea id="f_message"></textarea>
    <label style="display:flex;gap:8px;align-items:flex-start;font-weight:500">
      <input id="f_consent" type="checkbox" style="width:auto;margin-top:4px">
      I agree to prepare this summary and contact Design Infra through its official website.
    </label>
    <button class="btn" onclick="submitLead()">पूछताछ भेजें</button>
  </div>
  <div class="card" id="resultBox">
    <p style="font-weight:700">Inquiry summary तैयार है</p>
    <button class="btn" type="button" onclick="copyInquiry()">Copy inquiry details</button>
    <a class="btn secondary" href="https://designinfra.in/" target="_blank" rel="noopener">Open official website</a>
    <pre id="rawText" class="note" style="text-align:left;white-space:pre-wrap"></pre>
    <p class="note">Privacy: this public page does not store or transmit your details.</p>
  </div>
</div>
<script>
let inquiryText='';
function submitLead(){
  const name=document.getElementById('f_name').value.trim();
  const phone=document.getElementById('f_phone').value.trim();
  if(!name||!phone){alert('Please fill name and phone');return;}
  const digits=phone.replace(/\D/g,'');
  if(digits.length<10||digits.length>13){alert('Please enter a valid phone number');return;}
  if(!document.getElementById('f_consent').checked){alert('Please confirm contact consent');return;}
  const source=new URLSearchParams(location.search).get('src')||'instagram-bio';
  const text=['Name: '+name,'Phone: '+phone,'City: '+document.getElementById('f_city').value,'Project: '+document.getElementById('f_project').value,'Budget: '+document.getElementById('f_budget').value,'Source: '+source,'Message: '+document.getElementById('f_message').value].join('\n');
  document.getElementById('formBox').classList.add('hide');
  document.getElementById('resultBox').classList.add('show');
  inquiryText=text;
  document.getElementById('rawText').textContent=text;
}
async function copyInquiry(){
  if(!inquiryText)return;
  try{
    await navigator.clipboard.writeText(inquiryText);
    alert('Inquiry details copied');
  }catch(e){
    document.getElementById('rawText').focus();
    alert('Please select and copy the inquiry details shown below');
  }
}
</script>
</body></html>
